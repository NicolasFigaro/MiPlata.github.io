<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Plata - Gestor Financiero Avanzado</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300 pb-20 sm:pb-6">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-2.5 rounded-2xl shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">Mi Plata</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Finanzas Personales Inteligentes</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="openModalExport()" title="Copia de Seguridad" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                </button>
                <button onclick="toggleDarkMode()" title="Cambiar Tema" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm sticky top-16 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto space-x-2 sm:space-x-4 py-2.5 no-scrollbar" id="navTabs">
            <!-- Rendered by JS -->
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6" id="appMain">
        <!-- Dynamic view content -->
    </main>

    <!-- General Modal Container -->
    <div id="generalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modalContainer">
            <!-- Dynamic Form or Content -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 right-5 sm:bottom-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Operación exitosa</span>
    </div>

    <footer class="mt-auto py-6 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800 hidden sm:block">
        <p>Mi Plata &bull; Control Financiero Personal Avanzado</p>
    </footer>

    <script>
        const G = [["Vivienda","n"],["Comida","n"],["Transporte","n"],["Servicios","n"],["Deudas/Tarjeta","n"],["Ocio","g"],["Compras","g"],["Otros","g"],["Ahorro","a"]];
        const I = ["Sueldo","Extra","Otro ingreso"];
        const WH = ["Efectivo","Cuenta de ahorros","Billetera digital (Nequi, Daviplata)"];
        const KEY = "miplata_advanced_v2";

        let S = {};
        try {
            const j = JSON.parse(localStorage.getItem(KEY) || "{}");
            S = Array.isArray(j) ? { items: j } : j;
        } catch(e) { S = {}; }

        S.items = S.items || [];
        S.acc = S.acc || [];
        S.inv = S.inv || [];
        S.cards = S.cards || [];
        S.trm = S.trm || 4000;
        S.sv = S.sv || [];
        S.rec = S.rec || [];
        S.dbt = S.dbt || [];
        S.bud = S.bud || {};
        S.th = S.th || { m: "auto", p: 0, pv: false };
        S.hide = S.hide || {};
        S.ini = S.ini || {};
        S.items.forEach(x => { if (x.t == "g") { if (WH.includes(x.k)) { x.w = x.k; x.k = ""; } else if (!x.k && !x.w) x.w = WH[0]; } });

        let tab = 0;
        let type = "g";
        let cur = new Date();
        cur.setDate(1);
        let usd = !!S.th.u;
        let sqry = "";
        let op = {};

        const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
        const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
        const fmt = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n || 0)).toLocaleString("es-CO");
        const fu = n => "US$" + (n || 0).toLocaleString("es-CO", { maximumFractionDigits: 2 });
        const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        const today = () => ym(new Date()) + "-" + String(new Date().getDate()).padStart(2, "0");
        const num = s => Number(String(s || "").replace(/\D/g, ""));
        const tf = n => String(n).replace(".", ",");
        const pr = s => parseFloat(String(s || "").replace(/\./g, "").replace(",", ".")) || 0;
        const cop = (v, c) => c == "USD" ? v * S.trm : v;
        const show = c => usd ? fu(c / S.trm) : fmt(c);

        const svm = () => S.sv.filter(x => x.d.startsWith(ym(cur)) && !x.i).reduce((s, x) => s + (x.cp ?? x.v), 0);
        const upto = (x, k) => !k || x.d.slice(0, 7) <= k;
        const svb = (id, k) => S.sv.filter(x => x.a == id && upto(x, k)).reduce((s, x) => s + x.v, 0);
        const bal = (w, k) => (S.ini[w] || 0) + S.items.filter(x => x.t == "tr" && x.to == w && upto(x, k)).reduce((s, x) => s + x.a, 0) + S.items.filter(x => upto(x, k)).reduce((s, x) => x.w != w ? s : x.t == "i" ? s + x.a : x.k ? s : s - x.a, 0) - S.sv.filter(x => x.w == w && !x.i && upto(x, k)).reduce((s, x) => s + (x.cp ?? x.v), 0);
        const me = (x, nm) => (+nm.slice(0, 4) * 12 + +nm.slice(5)) - (+x.d.slice(0, 4) * 12 + +x.d.slice(5, 7)) + 1;
        const cm = (x, nm) => { const q = x.q > 1 ? x.q : 1, e = me(x, nm); return e >= 1 && e <= q ? x.a / q : 0; };
        const pend = (x, nm) => { const q = x.q > 1 ? x.q : 1, e = me(x, nm); return e >= 1 && e <= q ? x.a - x.a / q * (e - 1) : 0; };
        const sum = (m, f) => m.filter(f).reduce((s, x) => s + x.a, 0);
        const vis = x => x.t != "g" || !(S.hide || {})[x.k || x.w || ""];
        const monAll = () => S.items.filter(x => x.d.startsWith(ym(cur)));
        const mon = () => monAll().filter(vis);
        const nextPay = p => {
            const n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), Math.min(p, 28));
            if (p > 28) d.setDate(p);
            if (d < new Date(n.getFullYear(), n.getMonth(), n.getDate())) d.setMonth(d.getMonth() + 1);
            return Math.round((d - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
        };
        const yieldOf = (id, r) => {
            const now = Date.now();
            return S.sv.filter(x => x.a == id).reduce((s, x) => {
                const dd = Math.max(0, Math.floor((now - new Date(x.d + "T00:00:00")) / 864e5));
                return s + x.v * (Math.pow(1 + r / 100, dd / 365) - 1);
            }, 0);
        };
        const fm = (a, v) => a.u ? fu(v) : fmt(v);
        const cardPaid = (c, nm) => S.items.filter(x => x.t == "p" && x.pc == c.n && x.d.startsWith(nm)).reduce((s, x) => s + x.a, 0);
        const cardDue = (c, nm) => c.paid[nm] ? 0 : Math.max(0, S.items.filter(x => x.k == c.n).reduce((t, x) => t + cm(x, nm), 0) - cardPaid(c, nm));

        // Cupo real de la tarjeta: lo que debes menos lo que ya pagaste (libera cupo al pagar desde cualquier lugar)
        const cardUse = (c, nm) => {
            const its = S.items.filter(x => x.k == c.n);
            const cq = its.reduce((t, x) => t + cm(x, nm), 0), us = its.reduce((t, x) => t + pend(x, nm), 0), ab = cardPaid(c, nm);
            const ok = !!c.paid[nm] || (cq > 0 && cq - ab <= 0);
            const used = Math.max(0, us - (ok ? Math.max(ab, cq) : ab));
            const raw = c.c ? used / c.c * 100 : 0;
            return { cq, us, ab, ok, used, raw, pct: Math.min(100, raw), avail: Math.max(0, (c.c || 0) - used) };
        };
        const useTone = p => p < 30 ? { bar: "bg-emerald-500", txt: "text-emerald-500", lbl: "Uso saludable" } : p < 70 ? { bar: "bg-amber-500", txt: "text-amber-500", lbl: "Uso moderado" } : { bar: "bg-rose-500", txt: "text-rose-500", lbl: "Uso alto" };

        // Sugerencias automáticas según tus números
        function tipsList(by) {
            const m = mon(), nm = ym(new Date()), T = [];
            const ing = sum(m, x => x.t == "i"), aho = svm();
            const gx = m.filter(x => x.t == "g" && !x.s);
            const kind = k => gx.filter(x => ((G.find(g => g[0] == x.c) || [])[1]) == k).reduce((t, x) => t + x.a, 0);
            const gas = gx.reduce((t, x) => t + x.a, 0), nec = kind("n"), gus = kind("g");
            const add = (lv, ic, t, d) => T.push({ lv, ic, t, d });

            let goodCard = false;
            S.cards.filter(c => c.c && !(S.hide || {})[c.n]).forEach(c => {
                const u = cardUse(c, nm), pc = Math.round(u.raw), d = nextPay(c.p);
                if (!u.ok && u.cq - u.ab > 0 && d <= 5) add(0, "fa-calendar-day", c.n + " vence en " + d + (d == 1 ? " día" : " días"), "Te faltan " + fmt(u.cq - u.ab) + " de la cuota. Págala a tiempo y evita intereses de mora.");
                if (u.raw >= 70) add(0, "fa-credit-card", c.n + " está al " + pc + "% del cupo", "Abona para liberar cupo. Lo ideal es mantener cada tarjeta por debajo del 30%.");
                else if (u.raw >= 30) add(1, "fa-credit-card", c.n + " va en " + pc + "% del cupo", "Antes de otra compra a cuotas, abona un poco. Meta: menos del 30% utilizado.");
                else if (!goodCard) { goodCard = true; add(3, "fa-circle-check", "Buen manejo de " + c.n, "Solo usas el " + pc + "% del cupo. Eso cuida tu historial crediticio."); }
            });

            if (ing <= 0 && gas > 0) add(2, "fa-arrow-trend-up", "Aún no registras ingresos este mes", "Anótalos para ver tu distribución real y recibir mejores sugerencias.");
            if (ing > 0) {
                if (gus / ing > 0.3) add(1, "fa-scale-balanced", "Gustos al " + Math.round(gus / ing * 100) + "% de tus ingresos", "La regla 50/30/20 sugiere máximo 30% en ocio, compras y otros. Recorta un poco esta semana.");
                if (nec / ing > 0.5) add(1, "fa-house", "Necesidades al " + Math.round(nec / ing * 100) + "% de tus ingresos", "Supera el 50% ideal. Revisa gastos fijos y servicios que puedas ajustar.");
                if (aho / ing < 0.1) add(2, "fa-piggy-bank", "Págate primero", "Separa entre 10% y 20% apenas recibas el ingreso, antes de gastar.");
                else if (aho / ing >= 0.2) add(3, "fa-piggy-bank", "Estás ahorrando el " + Math.round(aho / ing * 100) + "%", "Vas por encima del 20% recomendado. ¡Sigue así!");
            }
            by.filter(([c, v]) => (S.bud || {})[c] && v > S.bud[c]).slice(0, 1).forEach(([c, v]) => add(1, "fa-bullseye", "Te pasaste en " + c, "Llevas " + fmt(v) + " de un presupuesto de " + fmt(S.bud[c]) + ". Frena esta categoría lo que queda del mes."));

            const ah = S.acc.filter(a => !a.f).reduce((t, a) => t + svb(a.id) * (a.u ? S.trm : 1), 0);
            if (gas > 0 && ah < gas * 3) add(2, "fa-shield-halved", "Arma tu fondo de emergencia", "Meta: 3 meses de gastos (≈ " + fmt(gas * 3) + "). Llevas " + Math.round(ah / (gas * 3) * 100) + "%.");
            if (!T.length) add(3, "fa-wand-magic-sparkles", "Todo en orden", "Sigue registrando tus movimientos y aquí aparecerán sugerencias a tu medida.");
            return { list: T.sort((a, b) => a.lv - b.lv).slice(0, 4), ing, nec, gus, aho };
        }
        const TIP_STY = [
            ["bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400", "Urgente"],
            ["bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400", "Ojo"],
            ["bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400", "Idea"],
            ["bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400", "Bien"]
        ];
        function tipsUI(by) {
            const r = tipsList(by), pc = v => r.ing > 0 ? Math.min(100, v / r.ing * 100) : 0;
            const bar = r.ing > 0 ? `
                <div class="mb-4">
                    <div class="flex w-full h-2 rounded-full overflow-hidden bg-slate-100 dark:bg-slate-800">
                        <div class="bar-seg bg-indigo-500" style="width:${pc(r.nec)}%"></div><div class="bar-seg bg-amber-400" style="width:${pc(r.gus)}%"></div><div class="bar-seg bg-emerald-500" style="width:${pc(r.aho)}%"></div>
                    </div>
                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[11px] text-slate-500 dark:text-slate-400">
                        <span><i class="fa-solid fa-circle text-[7px] text-indigo-500 mr-1"></i>Necesidades ${Math.round(r.nec / r.ing * 100)}% <span class="text-slate-400">(ideal 50)</span></span>
                        <span><i class="fa-solid fa-circle text-[7px] text-amber-400 mr-1"></i>Gustos ${Math.round(r.gus / r.ing * 100)}% <span class="text-slate-400">(30)</span></span>
                        <span><i class="fa-solid fa-circle text-[7px] text-emerald-500 mr-1"></i>Ahorro ${Math.round(r.aho / r.ing * 100)}% <span class="text-slate-400">(20)</span></span>
                    </div>
                </div>` : "";
            return `
                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div><h3 class="text-sm font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-lightbulb text-amber-400 mr-1.5"></i>Consejos para tu plata</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Según tus números de este mes</p></div>
                    </div>
                    ${bar}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${r.list.map((t, i) => `
                            <div class="tip lift flex items-start gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800" style="--i:${i}">
                                <div class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center text-sm ${TIP_STY[t.lv][0]} ${t.lv == 0 ? "pulse-ring" : ""}"><i class="fa-solid ${t.ic}"></i></div>
                                <div class="min-w-0">
                                    <p class="text-xs font-bold text-slate-800 dark:text-white leading-snug">${esc(t.t)}</p>
                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 leading-relaxed">${esc(t.d)}</p>
                                </div>
                            </div>`).join("")}
                    </div>
                </section>`;
        }

        // ===== Filtro de Inicio: por billetera o por tarjeta =====
        let flt = { k: "all", v: null };
        const fltMatch = x => {
            if (flt.k == "w") { const w = WH[flt.v]; return !x.k && (x.w == w || x.to == w); }
            if (flt.k == "cards") return !!x.k || x.t == "p";
            if (flt.k == "c") { const c = S.cards.find(c => c.id == flt.v); return !c || x.k == c.n || (x.t == "p" && x.pc == c.n); }
            return true;
        };
        function setFlt(k, v) { flt = { k, v: v ?? null }; draw(); }
        function fltSummary(m) {
            const tile = (l, v, cl) => `<div class="flex-1 min-w-0 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><span class="text-[10px] uppercase tracking-wider text-slate-400 block truncate">${l}</span><b class="text-sm ${cl || ""}">${v}</b></div>`;
            const nm = ym(cur);
            let t = "";
            if (flt.k == "w") {
                const w = WH[flt.v], ws = m.filter(x => !x.k && x.w == w);
                t = tile("Saldo actual", fmt(bal(w, nm))) + tile("Ingresos", "+" + fmt(sum(ws, x => x.t == "i")), "text-emerald-500") + tile("Salidas", fmt(sum(ws, x => x.t == "g" || x.t == "p")));
            } else if (flt.k == "cards") {
                const cs = S.cards.filter(c => !(S.hide || {})[c.n]);
                if (!cs.length) return `<p class="text-xs text-slate-400 mb-3">Aún no tienes tarjetas registradas.</p>`;
                let tc = 0, tu = 0;
                cs.forEach(c => { if (c.c) { tc += c.c; tu += cardUse(c, nm).used; } });
                const pc = tc ? tu / tc * 100 : 0;
                t = tile("Compras del mes", fmt(sum(m, x => !!x.k))) + tile("Cuota por pagar", fmt(cs.reduce((a, c) => a + cardDue(c, nm), 0)), "text-indigo-500") + tile("Cupo utilizado", tc ? Math.round(pc) + "%" : "—", tc ? useTone(pc).txt : "");
            } else if (flt.k == "c") {
                const c = S.cards.find(c => c.id == flt.v); if (!c) return "";
                const cu = cardUse(c, nm);
                t = tile("Compras del mes", fmt(sum(m, x => x.k == c.n))) + tile("Cuota a pagar", fmt(cardDue(c, nm)), "text-indigo-500") + tile("Cupo utilizado", c.c ? Math.round(cu.raw) + "%" : "—", c.c ? useTone(cu.raw).txt : "");
            }
            return t ? `<div class="flex gap-2 mb-3">${t}</div>` : "";
        }
        function fltUI(m) {
            const chip = (on, ic, lbl, act, sm) => `<button onclick="${act}" class="shrink-0 ${sm ? "px-3 py-1.5 text-[11px]" : "px-3.5 py-2 text-xs"} rounded-xl font-semibold transition whitespace-nowrap ${on ? "bg-indigo-600 text-white shadow-md shadow-indigo-500/25" : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"}"><i class="fa-solid ${ic} mr-1.5"></i>${lbl}</button>`;
            const nom = ["Efectivo", "Cuenta de ahorros", "Billetera digital"], ics = ["fa-money-bill-wave", "fa-building-columns", "fa-mobile-screen"];
            const inCards = flt.k == "cards" || flt.k == "c";
            const row1 = chip(flt.k == "all", "fa-layer-group", "Todos", "setFlt('all')") + WH.map((w, i) => chip(flt.k == "w" && flt.v == i, ics[i], nom[i], `setFlt('w',${i})`)).join("") + chip(inCards, "fa-credit-card", "Tarjetas", "setFlt('cards')");
            const row2 = inCards && S.cards.length ? `<div class="subchips flex gap-2 overflow-x-auto no-scrollbar pb-1 mt-2">${chip(flt.k == "cards", "fa-layer-group", "Todas", "setFlt('cards')", 1)}${S.cards.map(c => chip(flt.k == "c" && flt.v == c.id, "fa-credit-card", esc(c.n), `setFlt('c',${c.id})`, 1)).join("")}</div>` : "";
            return `<div class="mb-3"><div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">${row1}</div>${row2}</div>${fltSummary(m)}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            genRec();
            applyTh();
            draw();
        });

        function applyTh() {
            const isDark = S.th.m == "dark" || (S.th.m == "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            S.th.m = S.th.m == "dark" ? "light" : "dark";
            save();
            applyTh();
            draw();
        }

                        <input id="trmInput" inputmode="decimal" value="${tf(S.trm)}" class="px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
                        <button onclick="setTrmVal()" class="py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-xs shadow-md">Actualizar TRM</button>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold">Mis Inversiones</h3><button onclick="newInv()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow-md">+ Nueva Inversión</button></div>
                ${R || '<p class="text-xs text-slate-400 text-center py-6">Agrega tu primera inversión.</p>'}
            `;
        }

        let charts = [];
        function vGra() {
            return `
                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm p-5">
                    <div class="flex justify-between items-center mb-4"><h3 class="text-sm font-bold">Gastos por categoría</h3>
                    <div class="flex items-center space-x-2"><button onclick="go(-1)" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800">‹</button><span class="text-xs font-semibold capitalize">${cur.toLocaleDateString("es-CO", { month: "long", year: "numeric" })}</span><button onclick="go(1)" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800">›</button></div></div>
                    <div class="max-w-xs mx-auto"><canvas id="chCat"></canvas></div>
                </section>
                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm p-5"><h3 class="text-sm font-bold mb-4">Ingresos vs gastos (6 meses)</h3><canvas id="chMon"></canvas></section>`;
        }

        function drawCharts() {
            charts.forEach(c => c.destroy()); charts = [];
            if (typeof Chart == "undefined") return;
            Chart.defaults.color = document.documentElement.classList.contains("dark") ? "#94a3b8" : "#64748b";
            const m = mon(), by = G.map(([c]) => [c, sum(m, x => x.t == "g" && x.c == c && !x.s)]).filter(x => x[1] > 0);
            charts.push(new Chart(document.getElementById("chCat"), { type: "doughnut", data: { labels: by.map(x => x[0]), datasets: [{ data: by.map(x => x[1]), backgroundColor: ["#6366f1","#8b5cf6","#10b981","#f59e0b","#ef4444","#06b6d4","#ec4899","#64748b","#84cc16"] }] } }));
            const ms = [...Array(6)].map((_, i) => ym(new Date(cur.getFullYear(), cur.getMonth() - 5 + i, 1)));
            const tot = (k, t) => S.items.filter(x => x.d.startsWith(k) && x.t == t && vis(x)).reduce((s, x) => s + x.a, 0);
            charts.push(new Chart(document.getElementById("chMon"), { type: "bar", data: { labels: ms, datasets: [{ label: "Ingresos", data: ms.map(k => tot(k, "i")), backgroundColor: "#10b981" }, { label: "Gastos", data: ms.map(k => tot(k, "g")), backgroundColor: "#6366f1" }] } }));
        }

        function vTar() {
            const m = monAll(), n = ym(new Date());
            let tc = 0, tu = 0;
            const cardsList = S.cards.map(c => {
                const u = sum(m, x => x.k == c.n), cu = cardUse(c, n), d = nextPay(c.p), tn = useTone(cu.raw);
                const pv = lastPct[c.id], ch = pv && (pv.b !== cu.pct || pv.n !== cu.raw);
                const fb = pv && (!anim || ch) ? pv.b : 0, fn = pv && (!anim || ch) ? pv.n : 0;
                lastPct[c.id] = { b: cu.pct, n: cu.raw };
                const pop = cu.ok && lastOk[c.id] === false; lastOk[c.id] = cu.ok;
                if (c.c) { tc += c.c; tu += cu.used; }
                return `
                    <div class="lift bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <b class="text-sm font-bold text-slate-800 dark:text-white">💳 ${esc(c.n)}</b>
                            <span class="text-xs font-semibold ${cu.ok ? "text-emerald-500" : d <= 5 ? "text-rose-500" : "text-slate-400"}">${cu.ok ? `<span class="${pop ? "pop" : ""}">Pagada ✓</span>` : "Vence en " + d + " d"}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs mb-4">
                            <div><span class="text-slate-400 block">Compras este mes</span><b>${fmt(u)}</b></div>
                            <div><span class="text-slate-400 block">Cuota a pagar</span><b class="text-indigo-600">${fmt(cu.ok ? 0 : Math.max(0, cu.cq - cu.ab))}</b></div>
                            <div><span class="text-slate-400 block">Abonado este mes</span><b class="text-emerald-600">${fmt(cu.ab)}</b></div>
                        </div>
                        ${c.c ? `
                        <div class="flex items-end justify-between mb-1.5">
                            <div><span class="cupo-pct text-2xl font-extrabold ${tn.txt}" data-from="${fn}" data-to="${cu.raw}">${Math.round(fn)}%</span><span class="text-xs text-slate-400 ml-1.5">del cupo utilizado</span></div>
                            <span class="text-[11px] font-semibold ${tn.txt}">${tn.lbl}</span>
                        </div>
                        <div class="relative w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden mb-2"><div class="cupo-bar ${tn.bar} h-full rounded-full" data-to="${cu.pct}" style="width:${fb}%"></div><div class="absolute top-0 bottom-0 w-px bg-slate-400/70" style="left:30%" title="Ideal: menos del 30%"></div></div>
                        <div class="flex justify-between text-[11px] text-slate-400 mb-3">
                            <span>Usado ${fmt(cu.used)}</span><span>Disponible <b class="text-emerald-500">${fmt(cu.avail)}</b></span><span>Cupo ${fmt(c.c)}</span>
                        </div>` : `<p class="text-[11px] text-slate-400 mb-3">Esta tarjeta no tiene cupo registrado.</p>`}
                        <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                            <button onclick="payCard(${c.id})" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-semibold">Abonar</button>
                            <button onclick="paidCard(${c.id})" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-semibold">${cu.ok ? "Desmarcar pago" : "Marcar pagada"}</button>
                            <button onclick="delCard(${c.id})" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold">Borrar</button>
                        </div>
                    </div>
                `;
            }).join("");

            const gp = tc ? tu / tc * 100 : 0, gt = useTone(gp);
            const pg = lastPct.all, chg = pg && (pg.b !== Math.min(100, gp) || pg.n !== gp);
            const gfb = pg && (!anim || chg) ? pg.b : 0, gfn = pg && (!anim || chg) ? pg.n : 0;
            lastPct.all = { b: Math.min(100, gp), n: gp };
            const summary = S.cards.length > 1 && tc ? `
                <section class="bg-gradient-to-br from-indigo-600 to-violet-700 text-white p-5 rounded-3xl shadow-xl shadow-indigo-500/10 mb-4">
                    <div class="flex items-end justify-between">
                        <div><small class="text-[10px] text-indigo-200 uppercase tracking-wider block">Cupo total utilizado</small><span class="cupo-pct text-3xl font-extrabold" data-from="${gfn}" data-to="${gp}">${Math.round(gfn)}%</span></div>
                        <div class="text-right text-xs"><span class="text-indigo-200 block">Disponible</span><b>${fmt(Math.max(0, tc - tu))}</b></div>
                    </div>
                    <div class="w-full bg-white/20 h-2.5 rounded-full overflow-hidden mt-3"><div class="cupo-bar bg-white h-full rounded-full" data-to="${Math.min(100, gp)}" style="width:${gfb}%"></div></div>
                    <p class="text-[11px] text-indigo-200 mt-2">${fmt(tu)} de ${fmt(tc)} · ${gt.lbl.toLowerCase()} (ideal: menos del 30%)</p>
                </section>` : "";

            return `
                <div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold">Mis Tarjetas de Crédito</h3><button onclick="newCard()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow-md">+ Agregar tarjeta</button></div>
                ${summary}
                ${cardsList || '<p class="text-xs text-slate-400 text-center py-6">Aún no tienes tarjetas registradas.</p>'}
            `;
        }

        function vSet() {
            const card = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm p-6 space-y-4";
            const inp = "w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono";
            const bud = G.filter(g => g[0] != "Ahorro").map(([c]) => `<div class="flex items-center justify-between gap-3 text-xs"><span class="font-medium">${c}</span><input inputmode="numeric" value="${S.bud[c] ? Number(S.bud[c]).toLocaleString("es-CO") : ""}" placeholder="Sin límite" oninput="fa(this)" onchange="setBud('${c}', this.value)" class="w-36 px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-right"></div>`).join("");
            const ini = WH.map((w, i) => `<div class="flex items-center justify-between gap-3 text-xs"><span class="font-medium">${w}</span><input inputmode="numeric" value="${S.ini[w] ? Number(S.ini[w]).toLocaleString("es-CO") : ""}" placeholder="0" oninput="fa(this)" onchange="setIni(${i}, this.value)" class="w-36 px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-right"></div>`).join("");
            const rec = S.rec.map(r => `<div class="flex justify-between items-center text-xs py-1"><span>${esc(r.n)} · día ${r.day} · ${fmt(r.a)}</span><button onclick="delRec(${r.id})" class="text-rose-500 font-semibold">Borrar</button></div>`).join("") || '<p class="text-xs text-slate-400">Sin gastos fijos.</p>';
            return `
                <section class="${card}"><h3 class="text-base font-bold">Presupuestos mensuales</h3>${bud}</section>
                <section class="${card}"><div class="flex justify-between items-center"><h3 class="text-base font-bold">Gastos fijos</h3><button onclick="newRec()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">+ Agregar</button></div>${rec}</section>
                <section class="${card}"><h3 class="text-base font-bold">Saldos iniciales</h3><p class="text-xs text-slate-400">Lo que ya tenías en cada billetera antes de empezar a anotar.</p>${ini}</section>
                <section class="${card}"><h3 class="text-base font-bold">Ocultar del resumen</h3><p class="text-xs text-slate-400">Lo que ocultes no suma en “En mano” ni en “Tarjetas”, y sus gastos no salen en el resumen ni en las gráficas.</p>${hidUI()}</section>
                <section class="${card}"><h3 class="text-base font-bold">Bloqueo con PIN</h3><p class="text-xs text-slate-400">Bloquea la pantalla al abrir la app. No cifra los datos.</p><button onclick="setPin()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl text-xs">${S.pin ? "Cambiar o quitar PIN" : "Crear PIN"}</button></section>
                <section class="${card}"><h3 class="text-base font-bold">Copia de seguridad</h3>
                    <textarea id="ex" readonly rows="4" class="${inp}">${esc(JSON.stringify(S))}</textarea>
                    <button onclick="copyBackup()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl text-xs">Copiar datos</button>
                    <button onclick="exportCsv()" class="px-4 py-2 bg-slate-800 dark:bg-slate-700 text-white font-semibold rounded-xl text-xs">Descargar CSV</button>
                    <label class="block text-xs font-semibold text-slate-500 uppercase pt-2">Restaurar copia (pega el JSON)</label>
                    <textarea id="imp" rows="3" class="${inp}"></textarea>
                    <button onclick="importBackup()" class="px-4 py-2 bg-slate-800 dark:bg-slate-700 text-white font-semibold rounded-xl text-xs">Restaurar</button>
                </section>`;
        }

        const INP = "w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white";
        const CARD = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm";
        const dbtLeft = d => d.t - (d.p0 || 0) - S.items.filter(x => x.dbt == d.id).reduce((s, x) => s + x.a, 0);

        function destUI() {
            const act = S.acc.filter(a => !a.f), o = [["", "Solo ingreso: queda en la billetera"]];
            if (S.cards.length) o.push(["card", "Pagar una tarjeta"]);
            if (act.length) o.push(["save", "Meter a una meta de ahorro que ya tengo"]);
            if (S.dbt.length) o.push(["debt", "Pagar una deuda"]);
            if (o.length < 2) return "";
            return `<label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Este ingreso va para</label>
                <select id="dest" onchange="setDest(this.value)" class="${INP}">${o.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
                <select id="payCard" class="${INP} hidden">${S.cards.map(c => `<option>${esc(c.n)}</option>`).join("")}</select>
                <select id="saveAcc" class="${INP} hidden">${act.map(a => `<option value="${a.id}">${esc(a.n)}${a.u ? " (USD)" : ""}</option>`).join("")}</select>
                <select id="debtSel" class="${INP} hidden">${S.dbt.map(d => `<option value="${d.id}">${esc(d.n)} · debes ${fmt(dbtLeft(d))}</option>`).join("")}</select>
                <input id="destAmt" inputmode="numeric" placeholder="¿Cuánto de este ingreso? (vacío = todo o la cuota)" oninput="fa(this)" class="${INP} hidden" autocomplete="off">`;
        }
        function setDest(v) {
            const g = id => document.getElementById(id);
            g("payCard").classList.toggle("hidden", v != "card"); g("saveAcc").classList.toggle("hidden", v != "save");
            g("debtSel").classList.toggle("hidden", v != "debt"); g("destAmt").classList.toggle("hidden", !v);
        }

        function togUsd() { usd = !usd; S.th.u = usd; save(); draw(); }

        function archAcc(id) { const a = S.acc.find(x => x.id == id); a.f = a.f ? 0 : 1; save(); draw(); }
        function arcUI() {
            const r = S.acc.filter(a => a.f).map(a => `<div class="flex items-center justify-between p-3 ${CARD} mb-2 text-xs"><span class="font-medium truncate pr-2">${esc(a.n)} · ${fm(a, svb(a.id) + Math.max(0, yieldOf(a.id, a.r)))}</span><span class="flex gap-3 shrink-0"><button onclick="archAcc(${a.id})" class="text-indigo-600 font-semibold">Restaurar</button><button onclick="delAcc(${a.id})" class="text-rose-500 font-semibold">Borrar</button></span></div>`).join("");
            return r ? '<h3 class="text-sm font-bold mt-6 mb-2 text-slate-500">Metas archivadas</h3>' + r : "";
        }

        const hideNames = () => WH.concat(S.cards.map(c => c.n));
        function hidUI() { return hideNames().map((n, i) => `<label class="flex items-center justify-between text-xs"><span class="font-medium">${esc(n)}</span><input type="checkbox" ${S.hide[n] ? "checked" : ""} onchange="togHide(${i})" class="w-4 h-4 accent-indigo-600"></label>`).join(""); }
        function togHide(i) { const n = hideNames()[i]; if (S.hide[n]) delete S.hide[n]; else S.hide[n] = true; save(); }

        function vDeu() {
            let T = 0;
            const L = S.dbt.map(d => {
                const left = dbtLeft(d), done = d.t - left, p = d.t ? Math.max(0, Math.min(100, done / d.t * 100)) : 0;
                T += Math.max(0, left);
                return `<div class="${CARD} p-5 mb-4">
                    <div class="flex justify-between items-center mb-2"><b class="text-sm font-bold">${esc(d.n)}</b><span class="text-xs font-semibold ${left <= 0 ? "text-emerald-500" : "text-slate-400"}">${left <= 0 ? "Pagada ✓" : p.toFixed(0) + "% pagado"}</span></div>
                    <div class="text-2xl font-extrabold mb-1">${fmt(Math.max(0, left))}</div>
                    <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden mb-1"><div class="bg-rose-500 h-full rounded-full" style="width:${p}%"></div></div>
                    <div class="text-[11px] text-slate-400 mb-3">Pagado ${fmt(done)} de ${fmt(d.t)}</div>
                    <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                        ${left > 0 ? `<button onclick="payDbt(${d.id})" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-semibold">Abonar</button>` : ""}
                        <button onclick="editDbt(${d.id})" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-semibold">Editar</button>
                        <button onclick="delDbt(${d.id})" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold">Borrar</button>
                    </div></div>`;
            }).join("");
            return `<section class="bg-gradient-to-br from-rose-600 to-red-800 text-white p-6 rounded-3xl shadow-xl shadow-rose-500/10 mb-6"><small class="text-xs text-rose-100 font-medium uppercase tracking-wider">Total que debo</small><div class="text-3xl font-extrabold mt-1">${fmt(T)}</div></section>
                <div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold">Mis Deudas</h3><button onclick="newDbt()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow-md">+ Nueva deuda</button></div>
                ${L || '<p class="text-xs text-slate-400 text-center py-6">Aquí anotas préstamos y deudas que no son de tarjeta.</p>'}`;
        }
        function newDbt() {
            openCustomModal("Nueva deuda", [{ l: "Nombre (ej. Préstamo moto)" }, { l: "Monto total", m: "numeric" }, { l: "Ya pagado antes (opcional)", m: "numeric" }], v => {
                const t = num(v[1]); if (!v[0] || !t) return "Escribe nombre y monto.";
                S.dbt.push({ id: Date.now(), n: v[0], t, p0: num(v[2]) }); save();
            });
        }
        function editDbt(id) {
            const d = S.dbt.find(x => x.id == id);
            openCustomModal("Editar deuda", [{ l: "Nombre", v: esc(d.n) }, { l: "Monto total", v: d.t, m: "numeric" }], v => {
                const t = num(v[1]); if (!v[0] || !t) return "Escribe nombre y monto.";
                d.n = v[0]; d.t = t; save();
            });
        }
        function payDbt(id) {
            const d = S.dbt.find(x => x.id == id);
            openCustomModal("Abonar a " + esc(d.n), [{ l: "¿De dónde sale?", o: WH }, { l: "Monto", v: Math.round(dbtLeft(d)) || "", m: "numeric" }], v => {
                const a = num(v[1]); if (!a) return "Escribe un monto válido.";
                S.items.push({ id: Date.now(), d: today(), t: "g", c: "Deudas/Tarjeta", n: "Pago deuda: " + d.n, a, k: "", w: v[0], q: 1, dbt: d.id }); save();
            });
        }
        function delDbt(id) { confirmAction("¿Borrar deuda? Los abonos ya hechos quedan como gastos.", () => { S.dbt = S.dbt.filter(x => x.id != id); save(); }); }

        function setBud(c, v) { const n = num(v); if (n) S.bud[c] = n; else delete S.bud[c]; save(); }

        function newRec() {
            const cs = G.filter(g => g[0] != "Ahorro").map(g => g[0]);
            openCustomModal("Nuevo gasto fijo", [{ l: "Nombre (ej. Arriendo)" }, { l: "Monto", m: "numeric" }, { l: "Día del mes (1-28)", v: "1", m: "numeric" }, { l: "Categoría", o: cs }, { l: "Se paga con", o: WH.concat(S.cards.map(c => c.n)) }], v => {
                const a = num(v[1]), day = Math.min(28, Math.max(1, num(v[2]) || 1)), isW = WH.includes(v[4]);
                if (!v[0] || !a) return "Escribe nombre y monto.";
                S.rec.push({ id: Date.now(), n: v[0], a, day, c: v[3], k: isW ? "" : v[4], w: isW ? v[4] : "", last: "" });
                genRec();
            });
        }

        function delRec(id) { confirmAction("¿Borrar gasto fijo?", () => { S.rec = S.rec.filter(r => r.id != id); save(); }); }

        function importBackup() {
            let j; try { j = JSON.parse(document.getElementById("imp").value); } catch (e) { return showToast("JSON inválido"); }
            if (!j || !Array.isArray(j.items)) return showToast("Ese JSON no parece una copia de Mi Plata");
            confirmAction("Esto reemplaza todos tus datos actuales. ¿Continuar?", () => { localStorage.setItem(KEY, JSON.stringify(j)); location.reload(); });
        }

        function fa(e) { const v = e.value.replace(/\D/g, ""); e.value = v ? Number(v).toLocaleString("es-CO") : ""; }

        function addMov() {
            const a = num(document.getElementById("amt").value);
            if (!a) { document.getElementById("msg").textContent = "Escribe un monto mayor a cero."; return; }
            const d = document.getElementById("date").value || today();
            const note = document.getElementById("note").value.trim();
            const cat = document.getElementById("cat").value;
            const sel = type == "g" ? document.getElementById("cardSel").value : "", isW = WH.includes(sel);
            const card = isW ? "" : sel;
            const wh = type == "i" ? document.getElementById("whSel").value : (isW ? sel : "");
            const cq = type == "g" && document.getElementById("cq") && document.getElementById("cq").value ? Math.max(1, num(document.getElementById("cq").value)) : 1;

            const g = id => document.getElementById(id), ds = type == "i" && g("dest") ? g("dest").value : "", da = ds ? num(g("destAmt").value) : 0, er = t => { g("msg").textContent = t; };
            let pa = 0, pcSel = "", ac = null, db = null;
            if (ds == "card") {
                pcSel = g("payCard").value;
                pa = Math.min(a, da || cardDue(S.cards.find(c => c.n == pcSel), ym(new Date())));
                if (!(pa > 0)) return er("Esa tarjeta no tiene cuota pendiente este mes.");
            } else if (ds == "save") {
                ac = S.acc.find(x => x.id == g("saveAcc").value); pa = Math.min(a, da || a);
            } else if (ds == "debt") {
                db = S.dbt.find(x => x.id == g("debtSel").value); pa = Math.min(a, da || dbtLeft(db));
                if (!(pa > 0)) return er("Esa deuda ya está pagada.");
            }
            S.items.push({ id: Date.now(), d, t: type, c: cat, n: note, a, k: card, w: wh, q: cq });
            if (ds == "card") S.items.push({ id: Date.now() + 1, d, t: "p", c: "Pago tarjeta", n: "Pago " + pcSel, a: pa, k: "", pc: pcSel, w: wh, q: 1 });
            if (ds == "save") S.sv.push({ id: Date.now() + 1, a: ac.id, d, v: ac.u ? pa / S.trm : pa, cp: pa, w: wh });
            if (ds == "debt") S.items.push({ id: Date.now() + 1, d, t: "g", c: "Deudas/Tarjeta", n: "Pago deuda: " + db.n, a: pa, k: "", w: wh, q: 1, dbt: db.id });
            save();
            cur = new Date(d + "T00:00:00"); cur.setDate(1);
            showToast("Movimiento guardado exitosamente");
            draw();
        }

        function delMovItem(id) { confirmAction("¿Borrar este movimiento?", () => { S.items = S.items.filter(y => y.id != id); save(); }); }
        function setType(t) {
            const g = id => document.getElementById(id), a = g("amt") ? g("amt").value : "", n = g("note") ? g("note").value : "";
            type = t; draw();
            g("amt").value = a; g("note").value = n;
        }

        function editM(id) {
            const x = S.items.find(y => y.id == id); if (!x) return;
            openCustomModal("Editar movimiento", [
                { l: "Monto", v: x.a, m: "numeric" },
                { l: "Nota", v: esc(x.n) },
                { l: "Categoría", o: x.t == "g" ? G.filter(g => g[0] != "Ahorro").map(g => g[0]) : x.t == "p" ? ["Pago tarjeta"] : x.t == "tr" ? ["Transferencia"] : I, v: x.c },
                { l: "Fecha (AAAA-MM-DD)", v: x.d },
                { l: "¿Contar en el resumen de categorías?", o: ["Sí", "No"], v: x.s ? "No" : "Sí" }
            ], v => {
                const a = num(v[0]);
                if (!a) return "Escribe un monto mayor a cero.";
                if (!/^\d{4}-\d{2}-\d{2}$/.test(v[3])) return "Fecha inválida (AAAA-MM-DD).";
                Object.assign(x, { a, n: v[1], c: v[2], d: v[3], s: v[4] == "No" ? 1 : 0 }); save();
            });
        }

        function newAcc() {
            openCustomModal("Nueva Meta de Ahorro", [
                { l: "Nombre (ej. Viaje, Moto)" },
                { l: "Moneda", o: ["COP (pesos)", "USD (dólares)"] },
                { l: "Meta (monto)", m: "decimal" },
                { l: "Rendimiento anual E.A. % (0 si no gana)", v: "0", m: "decimal" },
                { l: "Ya tengo ahorrado (opcional)", m: "decimal" }
            ], v => {
                if (!v[0]) return "Escribe un nombre.";
                const u = v[1].startsWith("USD"), P = s => u ? (pr(s) || 0) : num(s), id = Date.now();
                S.acc.push({ id, n: v[0], g: P(v[2]), r: pr(v[3]) || 0, u: u ? 1 : 0 });
                if (P(v[4])) S.sv.push({ id: id + 1, a: id, d: today(), v: P(v[4]), i: 1 });
                save();
            });
        }

        function editAcc(id) {
            const a = S.acc.find(x => x.id == id);
            openCustomModal("Editar Meta", [
                { l: "Nombre", v: esc(a.n) },
                { l: "Meta", v: tf(a.g), m: "decimal" },
                { l: "Rendimiento E.A. %", v: tf(a.r), m: "decimal" }
            ], v => {
                if (v[0]) a.n = v[0]; a.g = pr(v[1]); a.r = pr(v[2]) || 0; save();
            });
        }

        function delAcc(id) { confirmAction("¿Borrar meta y sus movimientos?", () => { S.acc = S.acc.filter(x => x.id != id); S.sv = S.sv.filter(x => x.a != id); save(); }); }

        function mov(id, s) {
            const a = S.acc.find(x => x.id == id), U = a.u, K = U ? S.trm : 1;
            openCustomModal(s > 0 ? "Meter a " + esc(a.n) : "Sacar de " + esc(a.n), [
                { l: s > 0 ? "¿De dónde sale?" : "¿A dónde regresa?", o: WH.map(w => w) },
                { l: U ? "Monto en USD" : "Monto", m: "decimal" }
            ], v => {
                const w = WH.find(p => v[0].startsWith(p)), n = U ? pr(v[1]) : num(v[1]);
                if (!(n > 0)) return "Escribe un monto válido.";
                S.sv.push({ id: Date.now(), a: id, d: today(), v: s * n, cp: s * n * K, w });
                save();
            });
        }

        function newInv() {
            openCustomModal("Nueva Inversión", [{ l: "Nombre (ej. ETF S&P 500)" }, { l: "Moneda", o: ["COP", "USD"] }, { l: "Monto invertido", m: "decimal" }], v => {
                const i = pr(v[2]); if (v[0] && i > 0) { S.inv.push({ id: Date.now(), n: v[0], c: v[1], i, v: i }); save(); }
            });
        }

        function upInv(id) {
            const x = S.inv.find(y => y.id == id);
            openCustomModal("Actualizar valor", [{ l: "Valor actual en " + x.c, v: tf(x.v), m: "decimal" }], v => {
                const n = pr(v[0]); if (n >= 0) { x.v = n; save(); }
            });
        }

        function delInv(id) { confirmAction("¿Borrar inversión?", () => { S.inv = S.inv.filter(x => x.id != id); save(); }); }

        function setTrmVal() {
            const v = pr(document.getElementById("trmInput").value);
            if (v > 0) { S.trm = v; save(); showToast("TRM actualizada"); draw(); }
        }

        function newCard() {
            openCustomModal("Nueva Tarjeta", [{ l: "Nombre" }, { l: "Cupo total", m: "numeric" }, { l: "Día de corte (1-31)", v: "15", m: "numeric" }, { l: "Día límite pago (1-31)", v: "30", m: "numeric" }], v => {
                if (!v[0]) return "Escribe un nombre.";
                S.cards.push({ id: Date.now(), n: v[0], c: num(v[1]), k: +v[2] || 15, p: +v[3] || 30, paid: {} });
                save();
            });
        }

        function payCard(id) {
            const c = S.cards.find(x => x.id == id), nm = ym(new Date());
            openCustomModal("Abonar a " + esc(c.n), [
                { l: "¿De dónde sale?", o: WH },
                { l: "Monto", v: Math.round(cardDue(c, nm)) || "", m: "numeric" }
            ], v => {
                const a = num(v[1]);
                if (!a) return "Escribe un monto válido.";
                S.items.push({ id: Date.now(), d: today(), t: "p", c: "Pago tarjeta", n: "Pago " + c.n, a, k: "", pc: c.n, w: v[0], q: 1 });
                save();
            });
        }

        function paidCard(id) { const c = S.cards.find(x => x.id == id); c.paid[ym(new Date())] = !c.paid[ym(new Date())]; save(); draw(); }
        function delCard(id) { confirmAction("¿Borrar tarjeta?", () => { S.cards = S.cards.filter(x => x.id != id); save(); }); }

        function genRec() {
            const nm = ym(new Date()), td = new Date().getDate();
            (S.rec || []).forEach(r => {
                if (r.last != nm && td >= r.day) {
                    S.items.push({ id: Date.now() * 1000 + Math.floor(Math.random() * 1000), d: nm + "-" + String(r.day).padStart(2, "0"), t: "g", c: r.c, n: r.n, a: r.a, k: r.k, w: r.w, q: 1 });
                    r.last = nm;
                }
            });
            save();
        }

        function copyBackup() {
            const e = document.getElementById("ex"); e.select();
            try { navigator.clipboard.writeText(e.value); showToast("Datos copiados al portapapeles"); } catch(_) {}
        }

        function openModalExport() {
            goTab(N.length - 1);
        }

        let anim = true;
        const lastPct = {}, lastOk = {};
        // Anima la barra y el % del cupo desde el valor anterior hasta el nuevo
        function runCupoAnim() {
            const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
            document.querySelectorAll("#appMain .cupo-bar").forEach(el => { void el.offsetWidth; el.style.width = el.dataset.to + "%"; });
            document.querySelectorAll("#appMain .cupo-pct").forEach(el => {
                const a = +el.dataset.from, b = +el.dataset.to, t0 = performance.now();
                if (rm || a === b) { el.textContent = Math.round(b) + "%"; return; }
                const step = now => { const k = Math.min(1, (now - t0) / 900); el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))) + "%"; if (k < 1) requestAnimationFrame(step); };
                requestAnimationFrame(step);
            });
        }
        function goTab(i) { tab = i; anim = true; draw(); window.scrollTo(0, 0); }

        function countUp() {
            if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            document.querySelectorAll("#appMain h2.text-3xl, #appMain div.text-3xl, #appMain h4.text-lg").forEach(el => {
                const t = el.textContent.trim();
                if (!/^-?\$/.test(t)) return;
                const to = (t[0] == "-" ? -1 : 1) * Number(t.replace(/\D/g, "")), t0 = performance.now();
                const step = now => { const k = Math.min(1, (now - t0) / 700); el.textContent = fmt(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
                requestAnimationFrame(step);
            });
        }

        function newTransfer() {
            openCustomModal("Transferir entre billeteras", [{ l: "Desde", o: WH }, { l: "Hacia", o: WH, v: WH[1] }, { l: "Monto", m: "numeric" }], v => {
                const a = num(v[2]);
                if (v[0] == v[1]) return "Elige billeteras distintas.";
                if (!a) return "Escribe un monto válido.";
                S.items.push({ id: Date.now(), d: today(), t: "tr", c: "Transferencia", n: v[0].split(" ")[0] + " → " + v[1].split(" ")[0], a, k: "", w: v[0], to: v[1], q: 1 });
                save();
            });
        }

        function setIni(i, v) { const n = num(v); if (n) S.ini[WH[i]] = n; else delete S.ini[WH[i]]; save(); }

        function exportCsv() {
            const q = t => '"' + String(t ?? "").replace(/"/g, '""') + '"', tp = { i: "Ingreso", g: "Gasto", p: "Pago tarjeta", tr: "Transferencia" };
            const rows = [["Fecha", "Tipo", "Categoría", "Nota", "Monto", "Billetera", "Tarjeta", "Cuotas"]].concat(S.items.slice().sort((a, b) => a.d.localeCompare(b.d)).map(x => [x.d, tp[x.t] || x.t, x.c, x.n, x.a, x.w, x.k || x.pc || "", x.q > 1 ? x.q : ""]));
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(q).join(";")).join("\n")], { type: "text/csv" }));
            a.download = "mi-plata-" + today() + ".csv"; a.click();
        }

        const hashPin = async p => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("miplata" + p)))].map(b => b.toString(16).padStart(2, "0")).join("");

        function setPin() {
            if (!window.crypto || !crypto.subtle) return showToast("El PIN necesita abrir la app por https");
            openCustomModal("PIN de 4 a 6 dígitos", [{ l: "Nuevo PIN (vacío = quitar)", m: "numeric" }], v => {
                if (v[0] && !/^\d{4,6}$/.test(v[0])) return "Usa de 4 a 6 números.";
                if (!v[0]) { delete S.pin; save(); return; }
                hashPin(v[0]).then(h => { S.pin = h; save(); showToast("PIN guardado"); });
            });
        }

        function lockScreen() {
            if (!S.pin || !window.crypto || !crypto.subtle) return;
            const d = document.createElement("div");
            d.className = "fixed inset-0 z-[60] bg-slate-950 flex flex-col items-center justify-center gap-4 p-6";
            d.innerHTML = '<i class="fa-solid fa-lock text-3xl text-indigo-400"></i><input type="password" inputmode="numeric" maxlength="6" placeholder="PIN" class="w-40 text-center text-2xl tracking-widest px-4 py-3 rounded-2xl bg-slate-800 text-white"><p class="text-rose-400 text-xs min-h-[16px]"></p>';
            document.body.appendChild(d);
            const i = d.querySelector("input"), e = d.querySelector("p"); i.focus();
            i.oninput = async () => {
                if (i.value.length >= 4 && await hashPin(i.value) == S.pin) d.remove();
                else if (i.value.length >= 6) { e.textContent = "PIN incorrecto"; i.value = ""; }
            };
        }

        window.addEventListener("DOMContentLoaded", () => { lockScreen(); if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); });

        function showToast(msg) {
            const t = document.getElementById("toast");
            document.getElementById("toastMessage").textContent = msg;
            t.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => t.classList.add("translate-y-20", "opacity-0"), 3000);
        }
    </script>
</body>
</html>
