<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Plata - Gestor Financiero Avanzado</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mi Plata">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mejoras.css">
    <link rel="stylesheet" href="pantallas.css">
    <!-- Temas de color: se aplica antes de pintar para que no parpadee -->
    <script src="tema.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // indigo, violet y slate leen variables CSS (ver tema.js y styles.css): así todo el diseño cambia de tema sin tocar las clases
        const sc = v => Object.fromEntries([50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950].map(k => [k, 'rgb(var(--' + v + '-' + k + ') / <alpha-value>)']));
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: sc('p'), violet: sc('s'), slate: sc('n'),
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

    <!-- Barra superior: botón de regreso (dentro de "Más"), título pequeño que aparece al bajar y botones -->
    <header id="topBar" class="ios-nav sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-12 flex items-center gap-2">
            <button id="navBack" onclick="goTab(-1)" class="hidden shrink-0 -ml-2 px-2 py-1.5 text-[17px] text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5"><i class="fa-solid fa-chevron-left text-sm"></i>Más</button>
            <span id="navTitle" class="min-w-0 flex-1 truncate pointer-events-none text-[17px] font-semibold opacity-0 transition-opacity duration-200"></span>
            <div class="flex items-center gap-2 shrink-0">
                <button id="maskBtn" onclick="togMask()" title="Modo incógnito: ocultar cifras" aria-label="Modo incógnito" aria-pressed="false" class="nav-btn">
                    <i id="maskIcon" class="fa-solid fa-eye"></i>
                </button>
                <button onclick="openReport()" title="Reporte del mes (imprimir o guardar PDF)" aria-label="Reporte del mes" class="nav-btn">
                    <i class="fa-solid fa-file-lines"></i>
                </button>
                <button onclick="openModalExport()" title="Copia de Seguridad" aria-label="Copia de seguridad" class="nav-btn">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                </button>
                <button onclick="toggleDarkMode()" title="Cambiar Tema" aria-label="Cambiar entre claro y oscuro" class="nav-btn">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Título grande de la pantalla -->
    <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-1">
        <h1 id="largeTitle" class="text-[34px] leading-[41px] font-bold tracking-tight"></h1>
    </div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-6 space-y-4" id="appMain"></main>

    <!-- Barra de pestañas inferior (Inversión, Gráficas, Deudas y Ajustes están en "Más") -->
    <nav id="tabBar" class="fixed bottom-0 inset-x-0 z-40" aria-label="Navegación principal">
        <div class="max-w-xl mx-auto flex" id="tabItems"></div>
    </nav>

    <!-- Modal general -->
    <div id="generalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[20px] w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modalContainer"></div>
    </div>

    <!-- Botón flotante: anotar un movimiento desde cualquier pestaña -->
    <button id="fab" onclick="openMov()" title="Anotar movimiento" aria-label="Anotar movimiento" class="fixed right-5 z-40 w-14 h-14 rounded-full bg-indigo-600 text-white shadow-lg shadow-black/25 flex items-center justify-center text-xl active:scale-95 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Háptico en iPhone (ver buzz() en acciones.js) -->
    <label id="hapt" aria-hidden="true" style="position:fixed;left:-100px;top:0;opacity:0;pointer-events:none"><input type="checkbox" switch tabindex="-1"></label>

    <!-- Aviso -->
    <div id="toast" class="fixed right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Operación exitosa</span>
        <button id="toastAct" type="button" class="toast-act hidden text-sm"></button>
    </div>


    <!-- Orden importante: datos y cálculos → pantallas nuevas → pantallas → acciones -->
    <script src="logica.js"></script>
    <script src="pantallas.js"></script>
    <script src="vistas.js"></script>
    <script src="acciones.js"></script>
    <script src="reporte.js"></script>
</body>
</html>
