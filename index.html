<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Plata - Gestor Financiero Avanzado</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .theme-ocean { --primary: #0284c7; --primary-grad: linear-gradient(to bottom right, #0284c7, #0369a1); }
        .theme-mint { --primary: #0d9488; --primary-grad: linear-gradient(to bottom right, #0d9488, #115e59); }
        .theme-grape { --primary: #9333ea; --primary-grad: linear-gradient(to bottom right, #9333ea, #6b21a8); }
        .theme-sunset { --primary: #ea580c; --primary-grad: linear-gradient(to bottom right, #ea580c, #c2410c); }
        .theme-indigo { --primary: #4f46e5; --primary-grad: linear-gradient(to bottom right, #4f46e5, #4338ca); }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300 pb-24 sm:pb-6 theme-indigo" id="bodyApp">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 rounded-2xl text-white shadow-md shadow-indigo-500/20" style="background: var(--primary-grad);">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">Mi Plata</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Finanzas Personales Inteligentes</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="toggleDarkMode()" title="Cambiar Tema Oscuro/Claro" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm sticky top-16 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto space-x-2 py-2.5 no-scrollbar" id="navTabs"></div>
    </nav>

    <!-- Main Dynamic Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6 animate-fade-in" id="appMain">
    </main>

    <!-- General Modal Container -->
    <div id="generalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modalContainer">
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-24 right-5 sm:bottom-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Operación exitosa</span>
    </div>

    <script>
        const G = [["Vivienda","n"],["Comida","n"],["Transporte","n"],["Servicios","n"],["Deudas/Tarjeta","n"],["Ocio","g"],["Compras","g"],["Otros","g"],["Ahorro","a"]];
        const I = ["Sueldo","Extra","Otro ingreso"];
        const WH = ["Efectivo","Cuenta de ahorros","Billetera digital (Nequi, Daviplata)"];
        const KEY = "miplata_advanced_v2";

        let S = {};
        try { S = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { S = {}; }
        S.items = S.items || [];
        S.acc = S.acc || [];
        S.inv = S.inv || [];
        S.cards = S.cards || [];
        S.trm = S.trm || 4000;
        S.sv = S.sv || [];
        S.rec = S.rec || [];
        S.dbt = S.dbt || [];
        S.bud = S.bud || {};
        S.th = S.th || { m: "auto", theme: "indigo" };
        S.hide = S.hide || {};

        let tab = 0, type = "g", cur = new Date(), usd = false, sqry = "";
        cur.setDate(1);

        const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
        const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
        const fmt = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n || 0)).toLocaleString("es-CO");
        const fu = n => "US$" + (n || 0).toLocaleString("es-CO", { maximumFractionDigits: 2 });
        const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        const today = () => ym(new Date()) + "-" + String(new Date().getDate()).padStart(2, "0");
        const num = s => Number(String(s || "").replace(/\D/g, ""));
        const pr = s => parseFloat(String(s || "").replace(/\./g, "").replace(",", ".")) || 0;
        const cop = (v, c) => c == "USD" ? v * S.trm : v;
        const show = c => usd ? fu(c / S.trm) : fmt(c);
        const svm = () => S.sv.filter(x => x.d.startsWith(ym(cur)) && !x.i).reduce((s, x) => s + (x.cp ?? x.v), 0);
        const svb = id => S.sv.filter(x => x.a == id).reduce((s, x) => s + x.v, 0);
        const bal = w => S.items.reduce((s, x) => x.w != w ? s : x.t == "i" ? s + x.a : x.k ? s : s - x.a, 0) - S.sv.filter(x => x.w == w && !x.i).reduce((s, x) => s + (x.cp ?? x.v), 0);
        const me = (x, nm) => (+nm.slice(0, 4) * 12 + +nm.slice(5)) - (+x.d.slice(0, 4) * 12 + +x.d.slice(5, 7)) + 1;
        const cm = (x, nm) => { const q = x.q > 1 ? x.q : 1, e = me(x, nm); return e >= 1 && e <= q ? x.a / q : 0; };
        const pend = (x, nm) => { const q = x.q > 1 ? x.q : 1, e = me(x, nm); return e >= 1 && e <= q ? x.a - x.a / q * (e - 1) : 0; };
        const sum = (m, f) => m.filter(f).reduce((s, x) => s + x.a, 0);
        const vis = x => x.t != "g" || !(S.hide || {})[x.k || x.w || ""];
        const monAll = () => S.items.filter(x => x.d.startsWith(ym(cur)));
        const mon = () => monAll().filter(vis);
        const nextPay = p => {
            const n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), Math.min(p, 28));
            if (p > 28) d.setDate(p);
            if (d < new Date(n.getFullYear(), n.getMonth(), n.getDate())) d.setMonth(d.getMonth() + 1);
            return Math.round((d - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
        };
        const yieldOf = (id, r) => {
            const now = Date.now();
            return S.sv.filter(x => x.a == id).reduce((s, x) => {
                const dd = Math.max(0, Math.floor((now - new Date(x.d + "T00:00:00")) / 864e5));
                return s + x.v * (Math.pow(1 + r / 100, dd / 365) - 1);
            }, 0);
        };

        window.addEventListener('DOMContentLoaded', () => { applyTh(); draw(); });

        function applyTh() {
            const isDark = S.th.m == "dark" || (S.th.m == "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.classList.toggle('dark', isDark);
            const b = document.getElementById("bodyApp");
            b.className = `bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300 pb-24 sm:pb-6 theme-${S.th.theme || 'indigo'}`;
        }

        function toggleDarkMode() {
            S.th.m = S.th.m == "dark" ? "light" : "dark";
            save(); applyTh();
        }

        const N = ["Inicio", "Ahorro", "Inversión", "Tarjetas", "Ajustes"];
        const V = [vHome, vAho, vInv, vTar, vSet];

        function draw() {
            document.getElementById("navTabs").innerHTML = N.map((n, i) => `
                <button onclick="tab=${i}; draw(); window.scrollTo(0,0);" class="px-4 py-2 rounded-xl text-sm font-semibold transition whitespace-nowrap ${i === tab ? 'text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}" style="${i === tab ? 'background: var(--primary-grad);' : ''}">
                    ${n}
                </button>
            `).join("");
            document.getElementById("appMain").innerHTML = V[tab]();
        }

        function go(n) { cur.setMonth(cur.getMonth() + n); draw(); }

        function openCustomModal(title, fields, onSubmit) {
            const modal = document.getElementById("generalModal"), container = document.getElementById("modalContainer");
            container.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold text-slate-800 dark:text-white">${title}</h3>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="customForm" class="space-y-3">
                    ${fields.map((f, i) => `
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider">${f.l}</label>${f.o ? `<select name="f${i}" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm">${f.o.map(x=>`<option ${x==f.v?"selected":""}>${x}</option>`).join("")}</select>` : `<input name="f${i}" inputmode="${f.m||"text"}" value="${f.v??""}" placeholder="${f.p||""}" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm" autocomplete="off">`}
                        </div>
                    `).join("")}
                    <p class="text-rose-500 text-xs min-h-[16px]" id="modalError"></p>
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button type="button" onclick="closeModal()" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs">Cancelar</button>
                        <button type="submit" class="py-2.5 rounded-xl text-white font-semibold text-xs shadow-md" style="background: var(--primary-grad);">Aceptar</button>
                    </div>
                </form>
            `;
            modal.classList.remove("hidden");
            setTimeout(() => { modal.classList.remove("opacity-0"); container.classList.remove("scale-95"); container.classList.add("scale-100"); }, 10);
            document.getElementById("customForm").onsubmit = e => {
                e.preventDefault();
                const vals = fields.map((f, i) => document.getElementById("customForm").elements["f"+i].value.trim());
                const res = onSubmit(vals);
                if (typeof res === "string") document.getElementById("modalError").textContent = res;
                else { closeModal(); draw(); }
            };
        }

        function closeModal() {
            const modal = document.getElementById("generalModal"), container = document.getElementById("modalContainer");
            modal.classList.add("opacity-0"); container.classList.remove("scale-100"); container.classList.add("scale-95");
            setTimeout(() => modal.classList.add("hidden"), 300);
        }

        function confirmAction(msg, cb) {
            const modal = document.getElementById("generalModal"), container = document.getElementById("modalContainer");
            container.innerHTML = `<p class="text-sm font-medium mb-5">${msg}</p><div class="grid grid-cols-2 gap-3"><button onclick="closeModal()" class="py-2.5 rounded-xl border text-xs">Cancelar</button><button id="okBtn" class="py-2.5 rounded-xl bg-rose-600 text-white font-semibold text-xs">Sí, borrar</button></div>`;
            modal.classList.remove("hidden");
            setTimeout(() => { modal.classList.remove("opacity-0"); container.classList.remove("scale-95"); }, 10);
            document.getElementById("okBtn").onclick = () => { closeModal(); cb(); draw(); };
        }

        function vHome() {
            const m = mon(), ing = sum(m, x => x.t == "i"), aho = svm(), gas = sum(m, x => x.t == "g"), sob = ing - gas - aho;
            const cats = (type == "g" ? G.filter(x => x[0] != "Ahorro").map(x => x[0]) : I).map(c => `<option>${c}</option>`).join("");
            const hasW = S.items.some(x => x.w), nm = ym(new Date());
            const have = hasW ? WH.filter(w => !(S.hide || {})[w]).reduce((s, w) => s + bal(w), 0) : sob;
            const due = S.cards.filter(c => !c.paid[nm]).reduce((s, c) => s + S.items.filter(x => x.k == c.n).reduce((t, x) => t + cm(x, nm), 0), 0);
            const svt = S.acc.reduce((s, a) => s + svb(a.id) * (a.u ? S.trm : 1), 0), disp = have - due;

            const L = m.filter(x => !sqry || ((x.n || "") + " " + x.c).toLowerCase().includes(sqry.toLowerCase())).sort((a, b) => b.d.localeCompare(a.d) || b.id - a.id).map(x => `
                <div class="flex items-center justify-between py-3 border-b border-slate-100 dark:border-slate-800 last:border-0">
                    <div class="min-w-0 flex-1 pr-2">
                        <strong class="text-sm font-semibold block truncate">${esc(x.n || x.c)}</strong>
                        <small class="text-xs text-slate-400">${x.n ? esc(x.c) + " · " : ""}${x.d.slice(8)}/${x.d.slice(5, 7)}${x.k ? " · 💳 " + esc(x.k) : ""}${x.w ? " · " + esc(x.w) : ""}</small>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm font-bold ${x.t == "i" ? "text-emerald-500" : ""}">${x.t == "i" ? "+" : "-"}${fmt(x.a)}</span>
                        <button onclick="delMovItem(${x.id})" class="text-slate-400 hover:text-rose-600 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join("") || '<p class="text-xs text-slate-400 text-center py-4">Sin movimientos este mes.</p>';

            return `
                <section class="text-white p-6 rounded-3xl shadow-xl flex flex-col justify-between" style="background: var(--primary-grad);">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-medium uppercase tracking-wider opacity-80">Disponible para gastar</p>
                            <h2 class="text-3xl font-extrabold mt-1 tracking-tight ${disp < 0 ? "text-rose-200" : ""}">${fmt(disp)}</h2>
                        </div>
                        <div class="flex items-center space-x-2 bg-white/10 px-3 py-1.5 rounded-full">
                            <button onclick="go(-1)" class="font-bold">‹</button>
                            <span class="text-xs font-semibold capitalize">${cur.toLocaleDateString("es-CO", { month: "short", year: "numeric" })}</span>
                            <button onclick="go(1)" class="font-bold">›</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-white/10 text-xs">
                        <div><span class="opacity-70 block uppercase text-[10px]">Efectivo/Banco</span><b>${fmt(have)}</b></div>
                        <div><span class="opacity-70 block uppercase text-[10px]">Tarjetas</span><b>${fmt(due)}</b></div>
                        <div><span class="opacity-70 block uppercase text-[10px]">Ahorrado</span><b>${fmt(svt)}</b></div>
                    </div>
                </section>

                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <h3 class="text-sm font-bold mb-3">Registrar Movimiento</h3>
                    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl mb-4">
                        <button type="button" onclick="type='g'; draw();" class="py-2 rounded-xl text-xs font-bold transition ${type=='g'?'bg-white dark:bg-slate-700 text-rose-600 shadow-sm':'text-slate-500'}">Gasto</button>
                        <button type="button" onclick="type='i'; draw();" class="py-2 rounded-xl text-xs font-bold transition ${type=='i'?'bg-white dark:bg-slate-700 text-emerald-600 shadow-sm':'text-slate-500'}">Ingreso</button>
                    </div>
                    <div class="space-y-3">
                        <input id="amt" inputmode="numeric" placeholder="Monto" oninput="fa(this)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-2xl text-lg font-bold" autocomplete="off">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <select id="cat" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs">${cats}</select>
                            <input id="date" type="date" value="${today()}" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs">
                        </div>
                        ${type=="g"?`<select id="cardSel" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs"><option value="">Efectivo / Cuenta</option>${WH.concat(S.cards.map(c=>c.n)).map(x=>`<option>${esc(x)}</option>`).join("")}</select><input id="cq" inputmode="numeric" placeholder="Cuotas (opcional, ej. 3)" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs">`:`<select id="whSel" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs">${WH.map(w=>`<option>${w}</option>`).join("")}</select>`}
                        <input id="note" placeholder="Descripción (opcional)" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs" autocomplete="off">
                        <p class="text-rose-500 text-xs" id="msg"></p>
                        <button onclick="addMov()" class="w-full py-3 rounded-2xl text-white font-semibold text-xs shadow-lg" style="background: var(--primary-grad);">Guardar Movimiento</button>
                    </div>
                </section>

                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <h3 class="text-sm font-bold mb-3">Movimientos del mes</h3>
                    <input placeholder="Buscar por nota o categoría" value="${esc(sqry)}" onchange="sqry=this.value; draw();" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs mb-3">
                    <div class="space-y-1">${L}</div>
                </section>
            `;
        }

        function vAho() {
            let T = 0, Y = 0;
            const A = S.acc.filter(a => !a.f).map(a => {
                const s = svb(a.id), y = Math.max(0, yieldOf(a.id, a.r)), t = s + y, p = a.g ? Math.min(100, t / a.g * 100) : 0;
                T += a.u ? t * S.trm : t; Y += a.u ? y * S.trm : y;
                return `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm mb-4">
                        <div class="flex justify-between items-center mb-2"><b class="text-sm font-bold">${esc(a.n)}</b><span class="text-xs text-slate-400">${a.u?"USD · ":""}${a.r?a.r+"% E.A.":""}</span></div>
                        <div class="text-2xl font-extrabold mb-1">${a.u?fu(t):fmt(t)}</div>
                        ${a.g?`<div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden mb-1"><div class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width:${p}%"></div></div><div class="flex justify-between text-[11px] text-slate-400 mb-3"><span>${p.toFixed(0)}\%</span><span>Meta:${a.u?fu(a.g):fmt(a.g)}</span></div>`:""}
                        <div class="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                            <button onclick="mov(${a.id}, 1)" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-semibold">＋ Meter</button>
                            <button onclick="mov(${a.id}, -1)" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold">－ Sacar</button>
                            <button onclick="delAcc(${a.id})" class="px-3 py-1.5 text-rose-500 rounded-xl text-xs font-semibold ml-auto">Borrar</button>
                        </div>
                    </div>
                `;
            }).join("");

            return `
                <section class="text-white p-6 rounded-3xl shadow-xl mb-6" style="background: var(--primary-grad);">
                    <small class="text-xs uppercase tracking-wider opacity-80">Total Ahorrado</small>
                    <div class="text-3xl font-extrabold mt-1">${fmt(T)}</div>
                </section>
                <div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold">Mis Metas</h3><button onclick="newAcc()" class="px-4 py-2 text-white rounded-xl text-xs font-semibold shadow-md" style="background: var(--primary-grad);">+ Nueva meta</button></div>
                ${A || '<p class="text-xs text-slate-400 text-center py-6">Crea tu primera meta.</p>'}
            `;
        }

        function vInv() {
            let T = 0;
            const R = S.inv.map(x => {
                const v = cop(x.v, x.c); T += v; const g = x.v - x.i;
                return `
                    <div class="flex items-center justify-between p-4 bg-white dark:bg-slate-900 border rounded-2xl mb-3 shadow-sm">
                        <div><strong class="text-sm font-semibold block">${esc(x.n)}</strong><small class="text-xs text-slate-400">${x.c}</small></div>
                        <div class="text-right"><b class="text-sm font-bold block">${x.c=="USD"?fu(x.v):fmt(x.v)}</b><small class="text-xs ${g>=0?"text-emerald-500":"text-rose-500"}">${g>=0?"+":""}${((g/(x.i||1))*100).toFixed(1)}%</small></div>
                        <button onclick="delInv(${x.id})" class="p-2 text-rose-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join("");

            return `
                <section class="text-white p-6 rounded-3xl shadow-xl mb-6" style="background: var(--primary-grad);">
                    <small class="text-xs uppercase tracking-wider opacity-80">Portafolio Inversión</small>
                    <div class="text-3xl font-extrabold mt-1">${fmt(T)}</div>
                </section>
                <div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold">Inversiones</h3><button onclick="newInv()" class="px-4 py-2 text-white rounded-xl text-xs font-semibold shadow-md" style="background: var(--primary-grad);">+ Inversión</button></div>
                ${R || '<p class="text-xs text-slate-400 text-center py-6">Sin inversiones registradas.</p>'}
            `;
        }

        function vTar() {
            const m = monAll(), n = ym(new Date());
            const cardsList = S.cards.map(c => {
                const u = sum(m, x => x.k == c.n), its = S.items.filter(x => x.k == c.n);
                const cq = its.reduce((t, x) => t + cm(x, n), 0), ok = c.paid[n], d = nextPay(c.p);
                return `
                    <div class="bg-white dark:bg-slate-900 border rounded-3xl p-5 mb-4 shadow-sm">
                        <div class="flex justify-between items-center mb-2"><b class="text-sm font-bold">💳 ${esc(c.n)}</b><span class="text-xs font-semibold ${ok?"text-emerald-500":"text-slate-400"}">${ok?"Pagada ✓":"Vence en "+d+" d"}</span></div>
                        <div class="grid grid-cols-2 gap-2 text-xs mb-3"><div><span class="text-slate-400 block">Este mes</span><b>${fmt(u)}</b></div><div><span class="text-slate-400 block">Cuota a pagar</span><b class="text-indigo-600">${fmt(cq)}</b></div></div>
                        <div class="flex gap-2 pt-2 border-t"><button onclick="paidCard(${c.id})" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-semibold">${ok?"Desmarcar":"Marcar pagada"}</button><button onclick="delCard(${c.id})" class="px-3 py-1.5 text-rose-500 rounded-xl text-xs font-semibold ml-auto">Borrar</button></div>
                    </div>
                `;
            }).join("");

            return `<div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold">Tarjetas</h3><button onclick="newCard()" class="px-4 py-2 text-white rounded-xl text-xs font-semibold shadow-md" style="background: var(--primary-grad);">+ Tarjeta</button></div>${cardsList||'<p class="text-xs text-slate-400 text-center py-6">Sin tarjetas.</p>'}`;
        }

        function vSet() {
            return `
                <section class="bg-white dark:bg-slate-900 border rounded-3xl p-6 shadow-sm space-y-4">
                    <h3 class="text-base font-bold">Personalizar Tema de Color</h3>
                    <div class="grid grid-cols-5 gap-2">
                        <button onclick="setTheme('indigo')" class="h-10 rounded-xl bg-indigo-600"></button>
                        <button onclick="setTheme('ocean')" class="h-10 rounded-xl bg-sky-600"></button>
                        <button onclick="setTheme('mint')" class="h-10 rounded-xl bg-teal-600"></button>
                        <button onclick="setTheme('grape')" class="h-10 rounded-xl bg-purple-600"></button>
                        <button onclick="setTheme('sunset')" class="h-10 rounded-xl bg-orange-600"></button>
                    </div>
                </section>
                <section class="bg-white dark:bg-slate-900 border rounded-3xl p-6 shadow-sm space-y-4">
                    <h3 class="text-base font-bold">Sincronización y Respaldo</h3>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Copia de Seguridad / Exportar</label>
                        <textarea id="ex" readonly rows="3" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-mono">${esc(JSON.stringify(S))}</textarea>
                        <button onclick="copyBackup()" class="mt-2 px-4 py-2 text-white font-semibold rounded-xl text-xs shadow-md" style="background: var(--primary-grad);">Copiar datos</button>
                    </div>
                    <div class="pt-2 border-t">
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Importar / Pegar datos de otro dispositivo</label>
                        <textarea id="impData" rows="3" placeholder="Pega aquí el código JSON..." class="w-full p-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-mono"></textarea>
                        <button onclick="importBackup()" class="mt-2 px-4 py-2 bg-emerald-600 text-white font-semibold rounded-xl text-xs shadow-md">Cargar y sincronizar datos</button>
                    </div>
                </section>
            `;
        }

        function setTheme(t) { S.th.theme = t; save(); applyTh(); draw(); showToast("Tema actualizado"); }
        function fa(e) { const v = e.value.replace(/\D/g,""); e.value = v ? Number(v).toLocaleString("es-CO") : ""; }

        function addMov() {
            const a = num(document.getElementById("amt").value);
            if (!a) return showToast("Escribe un monto válido");
            const d = document.getElementById("date").value || today();
            S.items.push({ id: Date.now(), d, t: type, c: document.getElementById("cat").value, n: document.getElementById("note").value.trim(), a, k: type=="g"?document.getElementById("cardSel").value:"", w: type=="i"?document.getElementById("whSel").value:"", q: type=="g"&&document.getElementById("cq")?Math.max(1,num(document.getElementById("cq").value)):1 });
            save(); cur = new Date(d+"T00:00:00"); cur.setDate(1); showToast("Guardado con éxito"); draw();
        }

        function delMovItem(id) { confirmAction("¿Borrar movimiento?", () => S.items = S.items.filter(y => y.id != id)); }
        function newAcc() {
            openCustomModal("Nueva Meta", [{ l: "Nombre" }, { l: "Moneda", o: ["COP", "USD"] }, { l: "Meta", m: "decimal" }, { l: "Rendimiento E.A. %", v: "0", m: "decimal" }], v => {
                if(!v[0]) return "Escribe un nombre";
                S.acc.push({ id: Date.now(), n: v[0], g: pr(v[2]), r: pr(v[3])||0, u: v[1].startsWith("USD")?1:0 });
                save();
            });
        }
        function delAcc(id) { confirmAction("¿Borrar meta?", () => { S.acc = S.acc.filter(x => x.id != id); save(); }); }
        function mov(id, s) {
            openCustomModal(s>0?"Meter dinero":"Sacar dinero", [{ l: "Cuenta", o: WH }, { l: "Monto", m: "decimal" }], v => {
                const n = num(v[1]); if(!n) return "Escribe un monto";
                S.sv.push({ id: Date.now(), a: id, d: today(), v: s*n, w: WH.find(p=>v[0].startsWith(p)) }); save();
            });
        }
        function newInv() { openCustomModal("Inversión", [{ l: "Nombre" }, { l: "Moneda", o: ["COP", "USD"] }, { l: "Monto", m: "decimal" }], v => { const i = pr(v[2]); if(v[0]&&i>0){ S.inv.push({ id: Date.now(), n: v[0], c: v[1], i, v: i }); save(); } }); }
        function delInv(id) { confirmAction("¿Borrar?", () => S.inv = S.inv.filter(x => x.id != id)); }
        function newCard() { openCustomModal("Tarjeta", [{ l: "Nombre" }, { l: "Cupo", m: "numeric" }, { l: "Día pago", v: "30", m: "numeric" }], v => { if(!v[0])return "Nombre requerido"; S.cards.push({ id: Date.now(), n: v[0], c: num(v[1]), p: +v[2]||30, paid: {} }); save(); }); }
        function paidCard(id) { const c = S.cards.find(x => x.id == id); c.paid[ym(new Date())] = !c.paid[ym(new Date())]; save(); draw(); }
        function delCard(id) { confirmAction("¿Borrar?", () => S.cards = S.cards.filter(x => x.id != id)); }

        function copyBackup() {
            navigator.clipboard.writeText(document.getElementById("ex").value); showToast("Copiado al portapapeles");
        }

        function importBackup() {
            try {
                const parsed = JSON.parse(document.getElementById("impData").value);
                if(parsed && parsed.items) {
                    S = parsed; save(); draw(); showToast("¡Datos sincronizados con éxito!");
                } else { showToast("El código no es válido"); }
            } catch(e) { showToast("Error al leer el código JSON"); }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            document.getElementById("toastMessage").textContent = msg;
            t.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => t.classList.add("translate-y-20", "opacity-0"), 3000);
        }
    </script>
</body>
</html>
