<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Plata - Gestor Financiero Avanzado</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300 pb-20 sm:pb-6">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-2.5 rounded-2xl shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">Mi Plata</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Finanzas Personales Inteligentes</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="toggleDarkMode()" title="Cambiar Tema" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm sticky top-16 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto space-x-2 sm:space-x-4 py-2.5 no-scrollbar" id="navTabs">
            <!-- Rendered by JS -->
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6" id="appMain">
        <!-- Dynamic view content -->
    </main>

    <!-- General Modal Container -->
    <div id="generalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modalContainer">
            <!-- Dynamic Form or Content -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 right-5 sm:bottom-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Operación exitosa</span>
    </div>

    <footer class="mt-auto py-6 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800 hidden sm:block">
        <p>Mi Plata &bull; Control Financiero Personal Avanzado</p>
    </footer>

    <script>
        const G = [["Vivienda","n"],["Comida","n"],["Transporte","n"],["Servicios","n"],["Deudas/Tarjeta","n"],["Ocio","g"],["Compras","g"],["Otros","g"],["Ahorro","a"]];
        const I = ["Sueldo","Extra","Otro ingreso"];
        const WH = ["Efectivo","Cuenta de ahorros","Billetera digital (Nequi, Daviplata)"];
        const KEY = "miplata_advanced_v2";

        let S = {};
        try {
            const j = JSON.parse(localStorage.getItem(KEY) || "{}");
            S = Array.isArray(j) ? { items: j } : j;
        } catch(e) { S = {}; }

        S.items = S.items || [];
        S.acc = S.acc || [];
        S.inv = S.inv || [];
        S.cards = S.cards || [];
        S.trm = S.trm || 4000;
        S.sv = S.sv || [];
        S.rec = S.rec || [];
        S.dbt = S.dbt || [];
        S.bud = S.bud || {};
        S.th = S.th || { m: "auto", p: 0, pv: false };
        S.hide = S.hide || {};
        S.ini = S.ini || {};
        S.items.forEach(x => { if (x.t == "g") { if (WH.includes(x.k)) { x.w = x.k; x.k = ""; } else if (!x.k && !x.w) x.w = WH[0]; } });

        let tab = 0;
        let type = "g";
        let cur = new Date();
        cur.setDate(1);
        let usd = !!S.th.u;
        let sqry = "";
        let anim = false;
        let lastPct = {};
        let lastOk = {};

        const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
        const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
        
        // Formateo con soporte para decimales
        const fmt = n => {
            const hasDec = Math.abs(n % 1) > 0.001;
            return (n < 0 ? "-" : "") + "$" + Math.abs(n || 0).toLocaleString("es-CO", {
                minimumFractionDigits: hasDec ? 2 : 0,
                maximumFractionDigits: 2
            });
        };
        const fu = n => "US$" + (n || 0).toLocaleString("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        const today = () => ym(new Date()) + "-" + String(new Date().getDate()).padStart(2, "0");
        
        // Conversión numérica que preserva decimales
        const num = s => {
            if (!s) return 0;
            const str = String(s).replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
            return parseFloat(str) || 0;
        };
        const tf = n => String(n).replace(".", ",");
        const pr = s => num(s);
        const cop = (v, c) => c == "USD" ? v * S.trm : v;
        const show = c => usd ? fu(c / S.trm) : fmt(c);

        function fa(input) {
            let val = input.value.replace(/[^0-9.,]/g, '');
            input.value = val;
        }

        const svm = () => S.sv.filter(x => x.d.startsWith(ym(cur)) && !x.i).reduce((s, x) => s + (x.cp ?? x.v), 0);
        const upto = (x, k) => !k || x.d.slice(0, 7) <= k;
        const svb = (id, k) => S.sv.filter(x => x.a == id && upto(x, k)).reduce((s, x) => s + x.v, 0);
        const bal = (w, k) => (S.ini[w] || 0) + S.items.filter(x => x.t == "tr" && x.to == w && upto(x, k)).reduce((s, x) => s + x.a, 0) + S.items.filter(x => upto(x, k)).reduce((s, x) => x.w != w ? s : x.t == "i" ? s + x.a : x.k ? s : s - x.a, 0) - S.sv.filter(x => x.w == w && !x.i && upto(x, k)).reduce((s, x) => s + (x.cp ?? x.v), 0);
        const me = (x, nm) => (+nm.slice(0, 4) * 12 + +nm.slice(5)) - (+x.d.slice(0, 4) * 12 + +x.d.slice(5, 7)) + 1;
        const cm = (x, nm) => { const q = x.q > 1 ? x.q : 1, e = me(x, nm); return e >= 1 && e <= q ? x.a / q : 0; };
        const pend = (x, nm) => { const q = x.q > 1 ? x.q : 1, e = me(x, nm); return e >= 1 && e <= q ? x.a - x.a / q * (e - 1) : 0; };
        const sum = (m, f) => m.filter(f).reduce((s, x) => s + x.a, 0);
        const vis = x => x.t != "g" || !(S.hide || {})[x.k || x.w || ""];
        const monAll = () => S.items.filter(x => x.d.startsWith(ym(cur)));
        const mon = () => monAll().filter(vis);
        const nextPay = p => {
            const n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), Math.min(p, 28));
            if (p > 28) d.setDate(p);
            if (d < new Date(n.getFullYear(), n.getMonth(), n.getDate())) d.setMonth(d.getMonth() + 1);
            return Math.round((d - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
        };
        const yieldOf = (id, r) => {
            const now = Date.now();
            return S.sv.filter(x => x.a == id).reduce((s, x) => {
                const dd = Math.max(0, Math.floor((now - new Date(x.d + "T00:00:00")) / 864e5));
                return s + x.v * (Math.pow(1 + r / 100, dd / 365) - 1);
            }, 0);
        };
        const fm = (a, v) => a.u ? fu(v) : fmt(v);
        const cardPaid = (c, nm) => S.items.filter(x => x.t == "p" && x.pc == c.n && x.d.startsWith(nm)).reduce((s, x) => s + x.a, 0);
        const cardDue = (c, nm) => c.paid && c.paid[nm] ? 0 : Math.max(0, S.items.filter(x => x.k == c.n).reduce((t, x) => t + cm(x, nm), 0) - cardPaid(c, nm));

        const cardUse = (c, nm) => {
            const its = S.items.filter(x => x.k == c.n);
            const cq = its.reduce((t, x) => t + cm(x, nm), 0), us = its.reduce((t, x) => t + pend(x, nm), 0), ab = cardPaid(c, nm);
            const ok = !!(c.paid && c.paid[nm]) || (cq > 0 && cq - ab <= 0);
            const used = Math.max(0, us - (ok ? Math.max(ab, cq) : ab));
            const raw = c.c ? used / c.c * 100 : 0;
            return { cq, us, ab, ok, used, raw, pct: Math.min(100, raw), avail: Math.max(0, (c.c || 0) - used) };
        };
        const useTone = p => p < 30 ? { bar: "bg-emerald-500", txt: "text-emerald-500", lbl: "Uso saludable" } : p < 70 ? { bar: "bg-amber-500", txt: "text-amber-500", lbl: "Uso moderado" } : { bar: "bg-rose-500", txt: "text-rose-500", lbl: "Uso alto" };

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");
            toastMsg.textContent = msg;
            toastIcon.className = isSuccess ? "fa-solid fa-circle-check text-emerald-400" : "fa-solid fa-circle-exclamation text-rose-400";
            toast.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => toast.classList.add("translate-y-20", "opacity-0"), 3000);
        }

        // Punto 7: Comparación de gastos con el mes anterior
        function getPrevMonthComp(cat, currentMonthVal) {
            const prevMonthDate = new Date(cur.getFullYear(), cur.getMonth() - 1, 1);
            const prevYM = ym(prevMonthDate);
            const prevVal = S.items.filter(x => x.d.startsWith(prevYM) && x.t == "g" && x.c == cat && !x.s && vis(x)).reduce((s, x) => s + x.a, 0);
            const prevMonthName = prevMonthDate.toLocaleDateString("es-CO", { month: "short" }).replace('.', '');

            if (prevVal === 0) {
                return currentMonthVal > 0 ? `<span class="text-xs text-indigo-500 font-semibold ml-2">Nuevo este mes</span>` : "";
            }
            const diff = ((currentMonthVal - prevVal) / prevVal) * 100;
            if (Math.abs(diff) < 0.5) {
                return `<span class="text-xs text-slate-400 font-normal ml-2">Igual que ${prevMonthName}</span>`;
            }
            const isMore = diff > 0;
            const colorClass = isMore ? "text-rose-500" : "text-emerald-500";
            const sign = isMore ? "+" : "";
            return `<span class="text-xs ${colorClass} font-semibold ml-2">${sign}${diff.toFixed(0)}% vs ${prevMonthName}</span>`;
        }

        function tipsList(by) {
            const m = mon(), nm = ym(new Date()), T = [];
            const ing = sum(m, x => x.t == "i"), aho = svm();
            const gx = m.filter(x => x.t == "g" && !x.s);
            const kind = k => gx.filter(x => ((G.find(g => g[0] == x.c) || [])[1]) == k).reduce((t, x) => t + x.a, 0);
            const gas = gx.reduce((t, x) => t + x.a, 0), nec = kind("n"), gus = kind("g");
            const add = (lv, ic, t, d) => T.push({ lv, ic, t, d });

            let goodCard = false;
            S.cards.filter(c => c.c && !(S.hide || {})[c.n]).forEach(c => {
                const u = cardUse(c, nm), pc = Math.round(u.raw), d = nextPay(c.p);
                if (!u.ok && u.cq - u.ab > 0 && d <= 5) add(0, "fa-calendar-day", c.n + " vence en " + d + (d == 1 ? " día" : " días"), "Te faltan " + fmt(u.cq - u.ab) + " de la cuota. Págala a tiempo y evita intereses de mora.");
                if (u.raw >= 70) add(0, "fa-credit-card", c.n + " está al " + pc + "% del cupo", "Abona para liberar cupo. Lo ideal es mantener cada tarjeta por debajo del 30%.");
                else if (u.raw >= 30) add(1, "fa-credit-card", c.n + " va en " + pc + "% del cupo", "Antes de otra compra a cuotas, abona un poco. Meta: menos del 30% utilizado.");
                else if (!goodCard) { goodCard = true; add(3, "fa-circle-check", "Buen manejo de " + c.n, "Solo usas el " + pc + "% del cupo. Eso cuida tu historial crediticio."); }
            });

            if (ing <= 0 && gas > 0) add(2, "fa-arrow-trend-up", "Aún no registras ingresos este mes", "Anótalos para ver tu distribución real y recibir mejores sugerencias.");
            if (ing > 0) {
                if (gus / ing > 0.3) add(1, "fa-scale-balanced", "Gustos al " + Math.round(gus / ing * 100) + "% de tus ingresos", "La regla 50/30/20 sugiere máximo 30% en ocio, compras y otros. Recorta un poco esta semana.");
                if (nec / ing > 0.5) add(1, "fa-house", "Necesidades al " + Math.round(nec / ing * 100) + "% de tus ingresos", "Supera el 50% ideal. Revisa gastos fijos y servicios que puedas ajustar.");
                if (aho / ing < 0.1) add(2, "fa-piggy-bank", "Págate primero", "Separa entre 10% y 20% apenas recibas el ingreso, antes de gastar.");
                else if (aho / ing >= 0.2) add(3, "fa-piggy-bank", "Estás ahorrando el " + Math.round(aho / ing * 100) + "%", "Vas por encima del 20% recomendado. ¡Sigue así!");
            }
            by.filter(([c, v]) => (S.bud || {})[c] && v > S.bud[c]).slice(0, 1).forEach(([c, v]) => add(1, "fa-bullseye", "Te pasaste en " + c, "Llevas " + fmt(v) + " de un presupuesto de " + fmt(S.bud[c]) + ". Frena esta categoría lo que queda del mes."));

            const ah = S.acc.filter(a => !a.f).reduce((t, a) => t + svb(a.id) * (a.u ? S.trm : 1), 0);
            if (gas > 0 && ah < gas * 3) add(2, "fa-shield-halved", "Arma tu fondo de emergencia", "Meta: 3 meses de gastos (≈ " + fmt(gas * 3) + "). Llevas " + Math.round(ah / (gas * 3) * 100) + "%.");
            if (!T.length) add(3, "fa-wand-magic-sparkles", "Todo en orden", "Sigue registrando tus movimientos y aquí aparecerán sugerencias a tu medida.");
            return { list: T.sort((a, b) => a.lv - b.lv).slice(0, 4), ing, nec, gus, aho };
        }

        const TIP_STY = [
            ["bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400", "Urgente"],
            ["bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400", "Ojo"],
            ["bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400", "Idea"],
            ["bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400", "Bien"]
        ];

        function tipsUI(by) {
            const r = tipsList(by), pc = v => r.ing > 0 ? Math.min(100, v / r.ing * 100) : 0;
            const bar = r.ing > 0 ? `
                <div class="mb-4">
                    <div class="flex w-full h-2 rounded-full overflow-hidden bg-slate-100 dark:bg-slate-800">
                        <div class="bar-seg bg-indigo-500" style="width:${pc(r.nec)}%"></div><div class="bar-seg bg-amber-400" style="width:${pc(r.gus)}%"></div><div class="bar-seg bg-emerald-500" style="width:${pc(r.aho)}%"></div>
                    </div>
                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[11px] text-slate-500 dark:text-slate-400">
                        <span><i class="fa-solid fa-circle text-[7px] text-indigo-500 mr-1"></i>Necesidades ${Math.round(r.nec / r.ing * 100)}% <span class="text-slate-400">(ideal 50)</span></span>
                        <span><i class="fa-solid fa-circle text-[7px] text-amber-400 mr-1"></i>Gustos ${Math.round(r.gus / r.ing * 100)}% <span class="text-slate-400">(30)</span></span>
                        <span><i class="fa-solid fa-circle text-[7px] text-emerald-500 mr-1"></i>Ahorro ${Math.round(r.aho / r.ing * 100)}% <span class="text-slate-400">(20)</span></span>
                    </div>
                </div>` : "";
            return `
                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div><h3 class="text-sm font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-lightbulb text-amber-400 mr-1.5"></i>Consejos para tu plata</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Según tus números de este mes</p></div>
                    </div>
                    ${bar}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${r.list.map((t, i) => `
                            <div class="tip lift flex items-start gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800" style="--i:${i}">
                                <div class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center text-sm ${TIP_STY[t.lv][0]}${t.lv == 0 ? "pulse-ring" : ""}"><i class="fa-solid ${t.ic}"></i></div>
                                <div class="min-w-0">
                                    <p class="text-xs font-bold text-slate-800 dark:text-white leading-snug">${esc(t.t)}</p>
                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 leading-relaxed">${esc(t.d)}</p>
                                </div>
                            </div>`).join("")}
                    </div>
                </section>`;
        }

        let flt = { k: "all", v: null };
        const fltMatch = x => {
            if (flt.k == "w") { const w = WH[flt.v]; return !x.k && (x.w == w || x.to == w); }
            if (flt.k == "cards") return !!x.k || x.t == "p";
            if (flt.k == "c") { const c = S.cards.find(c => c.id == flt.v); return !c || x.k == c.n || (x.t == "p" && x.pc == c.n); }
            return true;
        };
        function setFlt(k, v) { flt = { k, v: v ?? null }; draw(); }
        
        function fltSummary(m) {
            const tile = (l, v, cl) => `<div class="flex-1 min-w-0 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><span class="text-[10px] uppercase tracking-wider text-slate-400 block truncate">${l}</span><b class="text-sm ${cl || ""}">${v}</b></div>`;
            const nm = ym(cur);
            let t = "";
            if (flt.k == "w") {
                const w = WH[flt.v], ws = m.filter(x => !x.k && x.w == w);
                t = tile("Saldo actual", fmt(bal(w, nm))) + tile("Ingresos", "+" + fmt(sum(ws, x => x.t == "i")), "text-emerald-500") + tile("Salidas", fmt(sum(ws, x => x.t == "g" || x.t == "p")));
            } else if (flt.k == "cards") {
                const cs = S.cards.filter(c => !(S.hide || {})[c.n]);
                if (!cs.length) return `<p class="text-xs text-slate-400 mb-3">Aún no tienes tarjetas registradas.</p>`;
                let tc = 0, tu = 0;
                cs.forEach(c => { if (c.c) { tc += c.c; tu += cardUse(c, nm).used; } });
                const pc = tc ? tu / tc * 100 : 0;
                t = tile("Compras del mes", fmt(sum(m, x => !!x.k))) + tile("Cuota por pagar", fmt(cs.reduce((a, c) => a + cardDue(c, nm), 0)), "text-indigo-500") + tile("Cupo utilizado", tc ? Math.round(pc) + "%" : "—", tc ? useTone(pc).txt : "");
            } else if (flt.k == "c") {
                const c = S.cards.find(c => c.id == flt.v); if (!c) return "";
                const cu = cardUse(c, nm);
                t = tile("Compras del mes", fmt(sum(m, x => x.k == c.n))) + tile("Cuota a pagar", fmt(cardDue(c, nm)), "text-indigo-500") + tile("Cupo utilizado", c.c ? Math.round(cu.raw) + "%" : "—", c.c ? useTone(cu.raw).txt : "");
            }
            return t ? `<div class="flex gap-2 mb-3">${t}</div>` : "";
        }

        function fltUI(m) {
            const chip = (on, ic, lbl, act, sm) => `<button onclick="${act}" class="shrink-0 ${sm ? "px-3 py-1.5 text-[11px]" : "px-3.5 py-2 text-xs"} rounded-xl font-semibold transition whitespace-nowrap ${on ? "bg-indigo-600 text-white shadow-md shadow-indigo-500/25" : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"}"><i class="fa-solid ${ic} mr-1.5"></i>${lbl}</button>`;
            const nom = ["Efectivo", "Cuenta de ahorros", "Billetera digital"], ics = ["fa-money-bill-wave", "fa-building-columns", "fa-mobile-screen"];
            const inCards = flt.k == "cards" || flt.k == "c";
            const row1 = chip(flt.k == "all", "fa-layer-group", "Todos", "setFlt('all')") + WH.map((w, i) => chip(flt.k == "w" && flt.v == i, ics[i], nom[i], `setFlt('w',${i})`)).join("") + chip(inCards, "fa-credit-card", "Tarjetas", "setFlt('cards')");
            const row2 = inCards && S.cards.length ? `<div class="subchips flex gap-2 overflow-x-auto no-scrollbar pb-1 mt-2">${chip(flt.k == "cards", "fa-layer-group", "Todas", "setFlt('cards')", 1)}${S.cards.map(c => chip(flt.k == "c" && flt.v == c.id, "fa-credit-card", esc(c.n), `setFlt('c',${c.id})`, 1)).join("")}</div>` : "";

        }

        window.addEventListener('DOMContentLoaded', () => {
            applyTh();
            draw();
        });

        function applyTh() {
            const isDark = S.th.m == "dark" || (S.th.m == "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            S.th.m = S.th.m == "dark" ? "light" : "dark";
            save();
            applyTh();
            draw();
        }

        function setType(t) { type = t; draw(); }

        function addMov() {
            const a = num(document.getElementById("amt").value);

            if (!a || a <= 0) { msg.textContent = "Ingresa un monto válido."; return; }
            if (!d) { msg.textContent = "Selecciona una fecha."; return; }

            const item = { id: Date.now(), t: type, a, c, d, n };

            if (type == "g") {
                const card = document.getElementById("cardSel").value;
                const q = num(document.getElementById("cq").value) || 1;
                if (WH.includes(card)) {
                    item.w = card;

                    item.k = card;
                    item.q = q;

                item.w = document.getElementById("whSel").value;

            S.items.push(item);
            save();
            showToast("Movimiento guardado con éxito");
            draw();

            S.items = S.items.filter(x => x.id !== id);

            const L = m.filter(fltMatch).filter(x => !sqry || ((x.n || "") + " " + x.c).toLowerCase().includes(sqry.toLowerCase())).sort((a, b) => b.d.localeCompare(a.d) || b.id - a.id).map(x => `

                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm font-bold ${x.t == "i" ? "text-emerald-500" : "text-slate-800 dark:text-white"}">${x.t == "i" ? "+" : x.t == "tr" ? "↔ " : "-"}${fmt(x.a)}</span>
                        <button onclick="delMovItem(${x.id})" class="text-slate-400 hover:text-rose-600 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>

            const hasW = S.items.some(x => x.w) || Object.keys(S.ini).length > 0, nm = ym(cur);
            const have = hasW ? WH.filter(w => !(S.hide || {})[w]).reduce((s, w) => s + bal(w, nm), 0) : sob;
            const due = S.cards.filter(c => !(S.hide || {})[c.n]).reduce((s, c) => s + cardDue(c, nm), 0);
            const svt = S.acc.reduce((s, a) => s + svb(a.id, nm) * (a.u ? S.trm : 1), 0), disp = have - due;
            const invT = S.inv.reduce((s, x) => s + cop(x.v, x.c), 0), invC = S.inv.reduce((s, x) => s + cop(x.i, x.c), 0);
            const totAcc = S.acc.filter(a => !a.f).reduce((s, a) => s + (svb(a.id) + Math.max(0, yieldOf(a.id, a.r))) * (a.u ? S.trm : 1), 0);

            const MT = S.acc.filter(a => !a.f).map(a => {

                return `<div class="mb-3 last:mb-0"><div class="flex justify-between text-xs mb-1 font-medium"><span>${esc(a.n)}</span><span>${fm(a, t)}${a.g ? " de " + fm(a, a.g) : ""}</span></div>${a.g ? `<div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full rounded-full" style="width:${p}%"></div></div>` : ""}</div>`;
            }).join("") || '<p class="text-xs text-slate-400 text-center py-2">Crea metas en la pestaña Ahorro.</p>';

            return `
                <section class="relative overflow-hidden bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 text-white p-6 rounded-3xl shadow-xl shadow-indigo-500/10 flex flex-col justify-between">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-medium uppercase tracking-wider text-indigo-200">Disponible para gastar</p>
                            <h2 class="text-3xl font-extrabold mt-1 tracking-tight ${disp < 0 ? "text-rose-300" : ""}">${fmt(disp)}</h2>

                            <button onclick="go(-1)" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-sm font-bold transition">‹</button>
                            <span class="text-xs font-semibold capitalize">${cur.toLocaleDateString("es-CO", { month: "long", year: "numeric" })}</span>
                            <button onclick="go(1)" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-sm font-bold transition">›</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-white/10">
                        <div><small class="text-[10px] text-indigo-200 block uppercase">En mano</small><b class="text-xs sm:text-sm font-bold">${fmt(have)}</b></div>
                        <div><small class="text-[10px] text-indigo-200 block uppercase">Tarjetas</small><b class="text-xs sm:text-sm font-bold">${fmt(due)}</b></div>
                        <div><small class="text-[10px] text-indigo-200 block uppercase">Apartado</small><b class="text-xs sm:text-sm font-bold">${fmt(svt)}</b></div>
                    </div>
                </section>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        <div class="flex justify-between items-center mb-1"><span class="text-xs font-semibold text-slate-500">Ahorros y Metas</span><i class="fa-solid fa-piggy-bank text-indigo-500"></i></div>
                        <h4 class="text-lg font-bold text-slate-800 dark:text-white">${fmt(totAcc)}</h4>
                        ${MT}
                    </div>
                    <div onclick="goTab(2)" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-indigo-500 transition shadow-sm lift">
                        <div class="flex justify-between items-center mb-1"><span class="text-xs font-semibold text-slate-500">Inversiones</span><i class="fa-solid fa-chart-line text-emerald-500"></i></div>
                        <h4 class="text-lg font-bold text-slate-800 dark:text-white">${show(invT)}</h4>
                        <p class="text-xs ${invT >= invC ? "text-emerald-500" : "text-rose-500"} mt-1 font-semibold">${invT >= invC ? "+" : ""}${fmt(invT - invC)} sobre lo invertido</p>
                    </div>
                </div>

                ${tipsUI(by)}

                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <div class="flex justify-between items-center mb-3"><h3 class="text-sm font-bold text-slate-800 dark:text-white">Anotar Movimiento</h3></div>
                    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl mb-4">
                        <button type="button" onclick="setType('g')" class="py-2 rounded-xl text-xs font-bold transition ${type=='g'?'bg-white dark:bg-slate-700 text-rose-600 shadow-sm':'text-slate-500'}">Gasto</button>
                        <button type="button" onclick="setType('i')" class="py-2 rounded-xl text-xs font-bold transition ${type=='i'?'bg-white dark:bg-slate-700 text-emerald-600 shadow-sm':'text-slate-500'}">Ingreso</button>
                    </div>
                    <div class="space-y-3">
                        <input id="amt" inputmode="decimal" placeholder="Monto" oninput="fa(this)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-lg font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500" autocomplete="off">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <select id="cat" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white">${cats}</select>
                            <input id="date" type="date" value="${today()}" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white">
                        </div>
                        ${type=="g"?`<select id="cardSel" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white">${WH.concat(S.cards.map(c=>c.n)).map(x=>`<option>${esc(x)}</option>`).join("")}</select><input id="cq" inputmode="numeric" placeholder="Cuotas (si pagas con tarjeta, ej. 3)" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white">`:`<select id="whSel" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white">${WH.map(w=>`<option>${w}</option>`).join("")}</select>`}
                        <input id="note" placeholder="Nota o descripción (opcional)" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white" autocomplete="off">
                        <p class="text-rose-500 text-xs" id="msg"></p>
                        <button onclick="addMov()" class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-500/20 transition">Guardar ${type=="g"?"Gasto":"Ingreso"}</button>
                    </div>
                </section>

                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-3">En qué se va la plata</h3>
                    <div class="space-y-3">
                        ${by.map(([c, v]) => {
                            const b = (S.bud || {})[c], r = b ? v / b : v / mx;
                            const compSpan = getPrevMonthComp(c, v);
                            return `<div class="text-xs">
                                <div class="flex justify-between items-center mb-1 font-medium">
                                    <div><span>${c}</span>${compSpan}</div>
                                    <span>${fmt(v)}${b ? " de " + fmt(b) : ""}</span>
                                </div>
                                <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden"><div class="h-full rounded-full ${b && r >= 1 ? "bg-rose-500" : "bg-indigo-600"}" style="width:${Math.min(100, r * 100)}%"></div></div>
                            </div>`;
                        }).join("") || '<p class="text-xs text-slate-400 text-center py-4">Aún no hay gastos este mes.</p>'}
                    </div>
                </section>

                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-slate-800 dark:text-white">Movimientos del mes</h3>
                    </div>
                    ${fltUI(m)}
                    <input placeholder="Buscar por nota o categoría y pulsa Enter" value="${esc(sqry)}" onchange="sqry=this.value; draw();" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white mb-3">
                    <div class="space-y-1">${L}</div>
                </section>
            `;
        }

        function vAho() {
            return `<section class="p-6 text-center text-slate-500 dark:text-slate-400">Pestaña Ahorros</section>`;
        }

        function vInv() {
            return `<section class="p-6 text-center text-slate-500 dark:text-slate-400">Pestaña Inversiones</section>`;
        }

        let charts = [];
        function vGra() {
            return `
                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm p-5">
                    <div class="flex justify-between items-center mb-4"><h3 class="text-sm font-bold">Gastos por categoría</h3>
                    <div class="flex items-center space-x-2"><button onclick="go(-1)" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800">‹</button><span class="text-xs font-semibold capitalize">${cur.toLocaleDateString("es-CO", { month: "long", year: "numeric" })}</span><button onclick="go(1)" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800">›</button></div></div>
                    <div class="max-w-xs mx-auto"><canvas id="chCat"></canvas></div>
                </section>
                <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm p-5"><h3 class="text-sm font-bold mb-4">Ingresos vs gastos (6 meses)</h3><canvas id="chMon"></canvas></section>`;
        }

        function drawCharts() {
            charts.forEach(c => c.destroy()); charts = [];
            if (typeof Chart == "undefined") return;
            Chart.defaults.color = document.documentElement.classList.contains("dark") ? "#94a3b8" : "#64748b";
            const m = mon(), by = G.map(([c]) => [c, sum(m, x => x.t == "g" && x.c == c && !x.s)]).filter(x => x[1] > 0);
            charts.push(new Chart(document.getElementById("chCat"), { type: "doughnut", data: { labels: by.map(x => x[0]), datasets: [{ data: by.map(x => x[1]), backgroundColor: ["#6366f1","#8b5cf6","#10b981","#f59e0b","#ef4444","#06b6d4","#ec4899","#64748b","#84cc16"] }] } }));
            const ms = [...Array(6)].map((_, i) => ym(new Date(cur.getFullYear(), cur.getMonth() - 5 + i, 1)));
            const tot = (k, t) => S.items.filter(x => x.d.startsWith(k) && x.t == t && vis(x)).reduce((s, x) => s + x.a, 0);
            charts.push(new Chart(document.getElementById("chMon"), { type: "bar", data: { labels: ms, datasets: [{ label: "Ingresos", data: ms.map(k => tot(k, "i")), backgroundColor: "#10b981" }, { label: "Gastos", data: ms.map(k => tot(k, "g")), backgroundColor: "#6366f1" }] } }));
        }

        // Punto 3: Navegación consistente por mes para la pestaña Tarjetas
        function vTar() {
            const selectedYM = ym(cur);
            const isCurrentMonth = selectedYM === ym(new Date());
            const m = S.items.filter(x => x.d.startsWith(selectedYM));
            
            let tc = 0, tu = 0;
            const cardsList = S.cards.map(c => {
                const u = sum(m, x => x.k == c.n);
                const cu = cardUse(c, selectedYM);
                const d = nextPay(c.p);
                const tn = useTone(cu.raw);
                if (c.c) { tc += c.c; tu += cu.used; }
                
                return `
                    <div class="lift bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-sm mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <b class="text-sm font-bold text-slate-800 dark:text-white">💳 ${esc(c.n)}</b>
                            <span class="text-xs font-semibold ${cu.ok ? "text-emerald-500" : (isCurrentMonth && d <= 5) ? "text-rose-500" : "text-slate-400"}">

                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs mb-4">
                            <div><span class="text-slate-400 block">Compras del mes</span><b>${fmt(u)}</b></div>
                            <div><span class="text-slate-400 block">Cuota a pagar</span><b class="text-indigo-600">${fmt(cu.ok ? 0 : Math.max(0, cu.cq - cu.ab))}</b></div>
                            <div><span class="text-slate-400 block">Abonado este mes</span><b class="text-emerald-600">${fmt(cu.ab)}</b></div>
                        </div>
                        ${c.c ? `
                        <div class="flex items-end justify-between mb-1.5">
                            <div><span class="cupo-pct text-2xl font-extrabold ${tn.txt}">${Math.round(cu.raw)}%</span><span class="text-xs text-slate-400 ml-1.5">del cupo utilizado</span></div>
                            <span class="text-[11px] font-semibold ${tn.txt}">${tn.lbl}</span>
                        </div>
                        <div class="relative w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden mb-2">
                            <div class="cupo-bar ${tn.bar} h-full rounded-full" style="width:${cu.pct}%"></div>
                            <div class="absolute top-0 bottom-0 w-px bg-slate-400/70" style="left:30%" title="Ideal: menos del 30%"></div>
                        </div>
                        <div class="flex justify-between text-[11px] text-slate-400 mb-3">
                            <span>Usado ${fmt(cu.used)}</span><span>Disponible <b class="text-emerald-500">${fmt(cu.avail)}</b></span><span>Cupo${fmt(c.c)}</span>
                        </div>` : `<p class="text-[11px] text-slate-400 mb-3">Esta tarjeta no tiene cupo registrado.</p>`}
                        <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                            <button onclick="paidCardMonth(${c.id}, '${selectedYM}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-semibold">${cu.ok ? "Desmarcar pago" : "Marcar pagada"}</button>
                            <button onclick="delCard(${c.id})" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold">Borrar</button>
                        </div>
                    </div>
                `;
            }).join("");

            const gp = tc ? tu / tc * 100 : 0, gt = useTone(gp);
            const summary = S.cards.length > 1 && tc ? `
                <section class="bg-gradient-to-br from-indigo-600 to-violet-700 text-white p-5 rounded-3xl shadow-xl shadow-indigo-500/10 mb-4">
                    <div class="flex items-end justify-between">
                        <div><small class="text-[10px] text-indigo-200 uppercase tracking-wider block">Cupo total utilizado</small><span class="cupo-pct text-3xl font-extrabold">${Math.round(gp)}%</span></div>
                        <div class="text-right text-xs"><span class="text-indigo-200 block">Disponible</span><b>${fmt(Math.max(0, tc - tu))}</b></div>
                    </div>
                    <div class="w-full bg-white/20 h-2.5 rounded-full overflow-hidden mt-3"><div class="cupo-bar bg-white h-full rounded-full" style="width:${Math.min(100, gp)}%"></div></div>
                    <p class="text-[11px] text-indigo-200 mt-2">${fmt(tu)} de ${fmt(tc)} · ${gt.lbl.toLowerCase()} (ideal: menos del 30%)</p>
                </section>` : "";

            return `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold">Mis Tarjetas de Crédito</h3>
                    <div class="flex items-center space-x-2">
                        <button onclick="go(-1)" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold">‹</button>
                        <span class="text-xs font-semibold capitalize">${cur.toLocaleDateString("es-CO", { month: "long", year: "numeric" })}</span>
                        <button onclick="go(1)" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold">›</button>
                    </div>
                </div>
                ${summary}
                ${cardsList || '<p class="text-xs text-slate-400 text-center py-6">Aún no tienes tarjetas registradas.</p>'}
            `;
        }

        function paidCardMonth(id, selectedYM) {
            const c = S.cards.find(x => x.id === id);
            if (!c) return;
            c.paid = c.paid || {};
            c.paid[selectedYM] = !c.paid[selectedYM];
            save();
            draw();
        }

        function delCard(id) {
            S.cards = S.cards.filter(c => c.id !== id);
            save();
            showToast("Tarjeta eliminada");
            draw();
        }

        // Punto 5: Copiar gastos fijos del mes anterior
        function copyLastMonthRec() {
            const prevMonthDate = new Date(cur.getFullYear(), cur.getMonth() - 1, 1);
            const prevYM = ym(prevMonthDate);
            const currentYM = ym(cur);

            const prevItems = S.items.filter(x => x.d.startsWith(prevYM) && x.isRec);
            if (!prevItems.length) {
                showToast("No se encontraron gastos fijos en el mes anterior", false);
                return;
            }

            let copiedCount = 0;
            prevItems.forEach(item => {
                const day = item.d.slice(8);
                const newDate = `${currentYM}-${day}`;
                const exists = S.items.some(x => x.d === newDate && x.c === item.c && x.a === item.a && x.isRec);
                if (!exists) {
                    S.items.push({
                        ...item,
                        id: Date.now() + Math.random(),
                        d: newDate
                    });
                    copiedCount++;
                }
            });

            save();
            showToast(`Se copiaron ${copiedCount} gastos fijos al mes actual`);
            draw();
        }

        function addRecItem() {
            const n = document.getElementById("recName").value.trim();
            const a = num(document.getElementById("recAmt").value);
            const day = num(document.getElementById("recDay").value) || 1;
            const c = document.getElementById("recCat").value;

            if (!n || !a) { showToast("Ingresa nombre y monto", false); return; }

            const id = Date.now();
            S.rec.push({ id, n, a, day, c });

            const formattedDay = String(Math.min(Math.max(day, 1), 28)).padStart(2, "0");
            const itemDate = `${ym(cur)}-${formattedDay}`;

            S.items.push({
                id: Date.now() + 1,
                t: "g",
                a,
                c,
                d: itemDate,
                n: `[Fijo] ${n}`,
                w: WH[0],
                isRec: true
            });

            save();
            showToast("Gasto fijo agregado");
            draw();
        }

        function delRec(id) {
            S.rec = S.rec.filter(r => r.id !== id);
            save();
            showToast("Gasto fijo eliminado");
            draw();
        }

        // NUEVO: Formatear / Limpiar toda la información de la aplicación
        function resetAllData() {
            if (confirm("⚠️ ¿ATENCIÓN: Estás seguro de que deseas formatear y borrar TODOS los datos?\n\nEsta acción eliminará de forma irreversible tu historial de ingresos, gastos, tarjetas, ahorros e inversiones.")) {
                localStorage.removeItem(KEY);
                S = {
                    items: [],
                    acc: [],
                    inv: [],
                    cards: [],
                    trm: 4000,
                    sv: [],
                    rec: [],
                    dbt: [],
                    bud: {},
                    th: { m: "auto", p: 0, pv: false },
                    hide: {},
                    ini: {}
                };
                save();
                showToast("Todos los datos han sido borrados");
                draw();
            }
        }

        function vSet() {
            const card = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm p-6 space-y-4";
            const inp = "w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono text-slate-800 dark:text-white";
            
            const rec = S.rec.map(r => `
                <div class="flex justify-between items-center text-xs py-1">
                    <span>${esc(r.n)} · día ${r.day} · ${fmt(r.a)}</span>
                    <button onclick="delRec(${r.id})" class="text-rose-500 font-semibold">Borrar</button>
                </div>
            `).join("") || '<p class="text-xs text-slate-400">Sin gastos fijos configurados.</p>';

            return `
                <section class="${card}">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-base font-bold">Gastos fijos</h3>
                            <p class="text-xs text-slate-400">Listado de gastos programados</p>
                        </div>
                        <button onclick="copyLastMonthRec()" class="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-semibold rounded-xl text-xs">
                            <i class="fa-solid fa-copy mr-1"></i> Copiar del mes anterior
                        </button>
                    </div>
                    <div class="space-y-2 border-t border-b border-slate-100 dark:border-slate-800 py-3">
                        <input id="recName" placeholder="Nombre del gasto (ej. Arriendo)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
                        <div class="grid grid-cols-3 gap-2">
                            <input id="recAmt" inputmode="decimal" placeholder="Monto" oninput="fa(this)" class="px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
                            <input id="recDay" type="number" min="1" max="28" placeholder="Día (1-28)" class="px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
                            <select id="recCat" class="px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
                                ${G.map(([c]) => `<option>${c}</option>`).join("")}
                            </select>
                        </div>
                        <button onclick="addRecItem()" class="w-full py-2 bg-indigo-600 text-white font-semibold rounded-xl text-xs">+ Agregar Gasto Fijo</button>
                    </div>
                    ${rec}
                </section>

                <section class="${card}">
                    <h3 class="text-base font-bold">Copia de Seguridad</h3>
                    <textarea id="ex" readonly rows="3" class="${inp}">${esc(JSON.stringify(S))}</textarea>
                    <button onclick="navigator.clipboard.writeText(JSON.stringify(S)); showToast('Datos copiados');" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl text-xs">Copiar JSON al portapapeles</button>
                </section>

                <section class="${card} border-rose-200 dark:border-rose-950">
                    <h3 class="text-base font-bold text-rose-600">Zona de Riesgo</h3>
                    <p class="text-xs text-slate-400">Si deseas borrar todos tus registros para reiniciar pruebas, usa esta opción.</p>
                    <button onclick="resetAllData()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-xs shadow-md shadow-rose-500/20 transition">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Formatear y Borrar Todo
                    </button>
                </section>
            `;
        }
    </script>
</body>
</html>
